<script>
(function(){
  "use strict";

  // 曲柄与车架几何(骑手组 translate(50,0) 内部坐标)
  var C = { x:400, y:300, r:26 };
  var HIPS = { far:{x:398, y:216}, near:{x:376, y:222} };
  var WHEEL = { r:{cx:290,cy:285}, f:{cx:610,cy:285} };

  var angle = 0, last = performance.now();
  // 车速(px/ms): 曲柄角速度 0.014 rad/ms × 轮半径 55 × 传动比 0.4727
  var SPEED = 0.014 * 55 * 0.4727;

  var wheelR = document.getElementById("wheelR");
  var wheelF = document.getElementById("wheelF");
  var crank  = document.getElementById("crank");
  var pedal1 = document.getElementById("pedal1");
  var pedal2 = document.getElementById("pedal2");
  var legFar = document.getElementById("legFar");
  var legNear= document.getElementById("legNear");
  var wing   = document.getElementById("wing");
  var bob    = document.getElementById("riderBob");
  var scarf  = document.getElementById("scarf");
  var scarfIn= document.getElementById("scarfInner");
  var dashes = document.getElementById("dashes");

  var clouds = Array.prototype.map.call(
    document.querySelectorAll(".cloud"),
    function(c){ return { el:c, x:+c.dataset.x, y:+c.dataset.y, s:+c.dataset.s }; });
  var pebbles = Array.prototype.map.call(
    document.querySelectorAll(".pebble"),
    function(p){ return { el:p, x:+p.dataset.x, y:+p.dataset.y, s:+p.dataset.s }; });
  var tufts = Array.prototype.map.call(
    document.querySelectorAll(".tuft"),
    function(t){ return { el:t, x:+t.dataset.x, y:+t.dataset.y, s:+t.dataset.s }; });

  function rot(id, cx, cy, deg){
    document.getElementById(id).setAttribute("transform", "rotate(" + deg + " " + cx + " " + cy + ")");
  }

  // 膝关节: 髋-脚 中点 + 前向偏折(让膝盖向前弯曲)
  function knee(hip, foot){
    var mx = (hip.x+foot.x)/2, my = (hip.y+foot.y)/2;
    var dx = foot.x-hip.x, dy = foot.y-hip.y;
    var len = Math.hypot(dx,dy) || 1;
    var bend = 15 * Math.min(1, len/42);
    var px = -dy/len, py = dx/len;
    if (px < 0){ px = -px; py = -py; }
    return { x: mx + px*bend, y: my + py*bend + 4 };
  }
  function setLeg(id, hip, k, f){
    document.getElementById(id).setAttribute("d",
      "M" + hip.x + "," + hip.y + " L" + k.x + "," + k.y + " L" + f.x + "," + f.y);
  }

  function frame(ts){
    var dt = Math.min(50, ts - last || 16.7);
    last = ts;

    angle += 0.014 * dt;                       // 曲柄角速度(rad/ms) ≈ 134 rpm
    var a = angle, sinA = Math.sin(a), cosA = Math.cos(a);
    var ad = (angle * 180 / Math.PI) % 360;   // 曲柄角度(deg)

    // 传动比 26/55 ≈ 0.4727; 车速 = 曲柄角 × 0.4727 × 55 = 曲柄角 × 26 px/rad
    rot("wheelR", WHEEL.r.cx, WHEEL.r.cy, ad * 0.4727);
    rot("wheelF", WHEEL.f.cx, WHEEL.f.cy, ad * 0.4727);

    // 曲柄旋转 + 踏板反向补偿保持水平
    crank.setAttribute("transform", "translate(" + C.x + "," + C.y + ") rotate(" + ad + ")");
    pedal1.setAttribute("transform", "translate(0,-26) rotate(" + (-ad) + ")");
    pedal2.setAttribute("transform", "translate(0,26) rotate(" + (-ad) + ")");

    // 两脚踏点(世界坐标) = 曲柄中心 + R(a)·(0,∓26)
    var f1 = { x:C.x + 26*sinA, y:C.y - 26*cosA };
    var f2 = { x:C.x - 26*sinA, y:C.y + 26*cosA };
    setLeg("legFar",  HIPS.far,  knee(HIPS.far,  f1), f1);
    setLeg("legNear", HIPS.near, knee(HIPS.near, f2), f2);

    // 翅膀扇动
    rot("wing", 352, 148, Math.sin(ts*0.012)*8 + 4);

    // 身体起伏(每半圈一次)
    bob.setAttribute("transform", "translate(0," + (-Math.abs(Math.sin(a))*4).toFixed(2) + ")");

    // 围巾波浪
    var pts = [], ptsIn = [], y = 150, x;
    for (x = 446; x >= 350; x -= 7){
      y += Math.sin(x*0.13 + ts*0.006)*4 + (446-x)*0.005;
      pts.push(x + "," + y.toFixed(1));
    }
    var d = pts.join(" ");
    scarf.setAttribute("points", d);
    scarfIn.setAttribute("points", d);

    // 路面虚线随曲柄滚动, 13 段周期 92px (车速 26px/rad)
    dashes.setAttribute("transform", "translate(" + (-((angle*26) % 92)) + ",0)");

    // 视差: s 为相对车速倍数, SPEED 由曲柄角速度 × 轮半径推导
    for (var i=0;i<clouds.length;i++){
      var c = clouds[i];
      c.x -= c.s * SPEED * dt;
      if (c.x < -150) c.x += 1120;
      c.el.setAttribute("transform", "translate(" + c.x.toFixed(1) + "," + c.y + ")");
    }
    for (var j=0;j<pebbles.length;j++){
      var p = pebbles[j];
      p.x -= p.s * SPEED * dt;
      if (p.x < -20) p.x += 1120;
      p.el.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y + ")");
    }
    for (var k=0;k<tufts.length;k++){
      var t = tufts[k];
      t.x -= t.s * SPEED * dt;
      if (t.x < -20) t.x += 1260;
      t.el.setAttribute("transform", "translate(" + t.x.toFixed(1) + "," + t.y + ")");
    }

    requestAnimationFrame(frame);
  }

  // 初始化各层位置, 再开始动画
  for (var i=0;i<clouds.length;i++)
    clouds[i].el.setAttribute("transform", "translate(" + clouds[i].x + "," + clouds[i].y + ")");
  for (var j=0;j<pebbles.length;j++)
    pebbles[j].el.setAttribute("transform", "translate(" + pebbles[j].x + "," + pebbles[j].y + ")");
  for (var k=0;k<tufts.length;k++)
    tufts[k].el.setAttribute("transform", "translate(" + tufts[k].x + "," + tufts[k].y + ")");

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
