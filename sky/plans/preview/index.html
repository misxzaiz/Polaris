<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sky — 无声界面 · 交互原型</title>
<style>
  :root {
    --bg: #07080c; --panel: #0d0f15; --panel-2: #131722;
    --line: #1e2430; --ink: #e6e9ef; --dim: #8b93a3; --faint: #5a6272;
    --accent: #7fd8ff; --ok: #43d48a; --warn: #f0b068;
    --radius: 14px; --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono: "SFMono-Regular",Consolas,Menlo,monospace;
  }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:15px/1.6 var(--font); -webkit-font-smoothing:antialiased; }
  a{color:var(--accent);text-decoration:none}

  /* ============ 顶栏(默认隐藏, 右下角圆钮呼出) ============ */
  .topbar { position:fixed; top:0; left:0; right:0; height:44px; display:flex; align-items:center;
    padding:0 12px; gap:10px; background:linear-gradient(rgba(7,8,12,.9),transparent);
    z-index:20; opacity:0; pointer-events:none; transition:opacity .2s; }
  body.hoverTop .topbar{ opacity:1; pointer-events:auto; }
  .dot { width:8px;height:8px;border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .topbar .status{ font-size:12px; color:var(--dim); }
  .spacer{ flex:1 }
  .pill{ background:var(--panel); border:1px solid var(--line); color:var(--ink);
    font-size:12px; padding:3px 10px; border-radius:999px; cursor:pointer; }
  .pill:hover{ border-color:var(--accent) }

  /* ──── 主画布 ──── */
  .river { height:100%; display:flex; flex-direction:column; }
  .stream { flex:1; overflow-y:auto; padding:64px 0 20px; scroll-behavior:smooth; }
  .col { max-width:760px; margin:0 auto; padding:0 20px; display:flex; flex-direction:column; gap:22px; }

  /* 消息 */
  .msg{ display:flex; gap:12px; }
  .avatar{ width:30px;height:30px;border-radius:9px; flex:none; display:grid;place-items:center;
    font-size:15px; }
  .avatar.user{ background:#232838; }
  .avatar.ai{ background:linear-gradient(135deg,#1b2a38,#142130); color:var(--accent); }
  .body{ flex:1; min-width:0 }
  .bubble{ background:var(--panel); border:1px solid var(--line); border-radius:4px 14px 14px 14px;
    padding:10px 14px; font-size:15px; }
  .msg.user .bubble{ background:transparent; border-color:transparent; color:var(--ink); }
  .meta{ font-size:11px; color:var(--faint); margin-top:5px; }

  /* markdown 内简贴 */
  .bubble p{ margin:0 0 8px } .bubble p:last-child{ margin-bottom:0 }
  .bubble code{ background:#10141d; padding:1px 5px;border-radius:5px;font:12px var(--mono); color:#b7d4ef }
  .bubble pre.code{ background:#0c1018; border:1px solid var(--line); border-radius:10px;padding:12px;overflow-x:auto }
  .bubble pre.code code{ background:none;padding:0 }

  /* 折叠条(思维链/工具调用) */
  .fold{ display:inline-flex; align-items:center; gap:7px; margin-top:7px; font-size:12px;
    color:var(--dim); cursor:pointer; user-select:none; background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:4px 12px; }
  .fold .chev{ transition:transform .18s; font-size:10px }
  .fold.open .chev{ transform:rotate(90deg) }
  .fold-body{ margin-top:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font-size:12px; color:var(--dim); display:none; white-space:pre-wrap }
  .fold.open + .fold-body{ display:block }
  .fold.live .spi{ width:10px;height:10px;border:1.5px solid var(--faint);border-top-color:var(--accent);
    border-radius:50%; animation:spin .7s linear infinite }
  @keyframes spin{ to{ transform:rotate(360deg) } }

  /* 表单卡 */
  .formcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; max-width:520px; animation:rise .25s ease }
  @keyframes rise{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .formcard h4{ margin:0 0 12px; font-size:14px }
  .frow{ margin-bottom:12px }
  .frow label{ display:block; font-size:12px; color:var(--dim); margin-bottom:5px }
  .frow input,.frow select,.frow textarea{ width:100%; background:#0e1219; border:1px solid var(--line);
    border-radius:9px; color:var(--ink); padding:8px 10px; font-size:14px; font-family:inherit }
  .frow input:focus{ outline:none; border-color:var(--accent) }
  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:4px }
  .btn{ background:#1f2733; color:var(--ink); border:1px solid var(--line); border-radius:9px;
    padding:7px 16px; font-size:13px; cursor:pointer }
  .btn.primary{ background:var(--accent); color:#06121a; border-color:transparent }
  .btn.small{ padding:4px 10px; font-size:12px }
  .formcard.done .frow{ opacity:.45; pointer-events:none }
  .donebadge{ display:none; align-items:center; gap:6px; color:var(--ok); font-size:13px; font-weight:500 }
  .formcard.done .donebadge{ display:inline-flex }

  /* 浮窗 */
  .floater{ position:fixed; right:24px; top:80px; width:360px; max-height:72vh; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; box-shadow:0 18px 50px rgba(0,0,0,.5);
    z-index:40; display:flex; flex-direction:column; animation:rise .22s ease; resize:both; overflow:hidden }
  .floater .fh{ display:flex; align-items:center; gap:8px; padding:10px 14px; font-size:12px;
    color:var(--dim); border-bottom:1px solid var(--line) }
  .floater .fh .grow{flex:1}
  .floater .fc{ padding:14px; font-size:13px; overflow:auto }
  .floater.hidden{ display:none }
  .close{ background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:0 4px }
  .close:hover{color:var(--ink)}

  /* token 设置 sheet */
  .sheet{ position:fixed; inset:0; z-index:50; background:rgba(4,5,8,.5); display:none;
    align-items:center; justify-content:center; backdrop-filter:blur(2px) }
  .sheet.open{ display:flex }
  .sheetcard{ width:340px; background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:18px; animation:rise .2s ease }
  .sheetcard h3{ margin:0 0 14px; font-size:15px }
  .sheetcard .frow{ display:flex; flex-direction:column; }
  .sheetcard .actions{ margin-top:4px }

  /* toast */
  #toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#1a2030; color:var(--ink); border:1px solid var(--line); border-radius:10px;
    padding:9px 18px; font-size:13px; opacity:0; transition:.25s; z-index:60; pointer-events:none; max-width:80vw }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0) }

  /* 输入区 */
  .composer{ flex:none; border-top:1px solid var(--line); background:rgba(7,8,12,.6); padding:12px 20px 18px }
  .composer .wrap{ max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:flex-end }
  .composer textarea{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    color:var(--ink); padding:11px 14px; font-size:15px; resize:none; line-height:1.5; font-family:inherit }
  .composer textarea:focus{ outline:none; border-color:var(--accent) }
  .send{ width:40px;height:40px;border-radius:12px;background:var(--accent);border:none;font-size:16px;
    cursor:pointer; flex:none }
  .composer .hint{ font-size:11px; color:var(--faint); margin-top:6px; max-width:760px; margin-inline:auto }

  .modechip{ position:fixed; bottom:26px; right:20px; display:flex; gap:6px; z-index:50 }
  .modechip .pill{ background:var(--panel); border:1px solid var(--line); font-size:11px; color:var(--dim) }
  .modechip .pill.on{ color:var(--accent); border-color:var(--accent) }

  @media (max-width:640px){
    .inner{ padding:0 14px }
    .floater{ inset:0; width:auto; height:auto; max-height:none; border-radius:0 }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="dot"></span>
  <span class="status" id="status">连接中…</span>
  <div class="spacer"></div>
  <button class="pill" onclick="openFloater()">🧭 浮窗</button>
  <button class="pill" onclick="openSheet()">⚙ token</button>
</div>

<div class="river">
  <div class="stream" id="stream">
    <div class="inner" id="river"></div>
  </div>
  <div class="composer">
    <div class="wrap">
      <textarea id="input" rows="1" placeholder="对 Sky 说点什么…（示例点右下 ▶ 播放）"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();skySend()}"></textarea>
      <button class="send" onclick="send()" title="发送">➤</button>
    </div>
    <div class="hint">回车发送 · Shift+Enter 换行 · 会话与工作区交给 AI · 只需一次 token 设置</div>
  </div>
</div>

<div class="modechip" id="modechip">
  <button class="pill on" data-m="demo" onclick="setMode('demo')">原型演示</button>
  <button class="pill" data-m="live" onclick="setMode('live')">连接后端</button>
</div>

<div class="floater hidden" id="floater">
  <div class="fh"><span>AI · 项目文件结构</span><span class="grow"/>　<button class="close" onclick="closeFloater()">✕</button></div>
  <div class="fc" id="floater-body"></div>
</div>

<div class="sheet" id="sheet">
  <div class="sheetcard">
    <h3>基础配置</h3>
    <div class="frow"><label>baseUrl</label><input id="c-base" placeholder="https://api.example.com/v1"></div>
    <div class="frow"><label>apiKey</label><input id="c-key" type="password" autocomplete="off" placeholder="sk-…"></div>
    <div class="frow"><label>model</label><select id="c-model"><option>gpt-4o-mini</option><option>deepseek-chat</option></select></div>
    <div class="actions"><button class="btn" onclick="closeSettings()">取消</button><button class="btn primary" onclick="saveConfig()">保存</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   交互原型 — 无声界面 (Silent Interface)
   双模式: 'mock' 内置演示数据 / 'live' 连接真实后端(WS:9825)
   ============================================================ */
const $ = s => document.querySelector(s);
const river = $('#river'), stream = $('#stream');
let mode = 'mock';
let ws = null, token = localStorage.getItem('sky.token') || '';

/* ---------- 渲染原子 ---------- */
function el(tag, cls, html){ const d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
function push(node){ river.appendChild(node); requestAnimationFrame(()=>{ stream.scrollTop=stream.scrollHeight; }); }

function addUser(text){
  const m=el('div','msg user');
  m.innerHTML='<div class="avatar user">我</div><div class="body"><div class="bubble"></div></div>';
  m.querySelector('.bubble').textContent=text;
  push(m);
}
function addAi(html){
  const m=el('div','msg ai');
  m.innerHTML='<div class="avatar ai">✦</div><div class="body"><div class="bubble"></div><div class="meta"></div></div>';
  m.querySelector('.bubble').innerHTML=html;
  push(m); return m;
}
function addFold(label, body){
  const f=el('div','fold','<span class="chev">▶</span><span>'+label+'</span>');
  const b=el('div','fold-body',body);
  f.onclick=()=>f.classList.toggle('open');
  const wrap=el('div',''); wrap.appendChild(f); wrap.appendChild(b);
  // 插到最近一条 AI 消息内
  const last=[...river.querySelectorAll('.msg.ai')].pop();
  if(last) last.querySelector('.body').appendChild(wrap);
  else river.appendChild(wrap);
  return wrap;
}
function addForm(fields, onsubmit){
  const fc=el('div','formcard');
  const rows=fields.map(f=>{
    let inp;
    if(f.type==='select') inp='<select data-n="'+f.name+'">'+f.options.map(o=>'<option>'+o+'</option>').join('')+'</select>';
    else if(f.type==='secret') inp='<input data-n="'+f.name+'" type="password" autocomplete="off" placeholder="••••">';
    else if(f.type==='textarea') inp='<textarea data-n="'+f.name+'"></textarea>';
    else if(f.type==='number') inp='<input data-n="'+f.name+'" type="number">';
    else if(f.type==='boolean') inp='<input data-n="'+f.name+'" type="checkbox">';
    else inp='<input data-n="'+f.name+'" type="text">';
    return '<div class="frow"><label>'+f.name+'</label>'+inp+'</div>';
  }).join('');
  fc.innerHTML='<h4>'+(fc.dataset.title||'表单')+'</h4>'+rows+
    '<div class="actions"><span class="donebadge">✓ 已完成</span><button class="btn" data-skip>跳过</button><button class="btn primary" data-sub>提交</button></div>';
  fc.querySelector('[data-sub]').onclick=()=>{
    const vals={}; fc.querySelectorAll('[data-n]').forEach(i=>{
      const n=i.dataset.n;
      if(i.type==='checkbox') vals[n]=i.checked;
      else vals[n]=i.value;
    });
    onDone(vals);
  };
  fc.querySelector('[data-skip]').onclick=()=> markDone(fc,true);
  push(fc);
}
function markDone(fc, skipped){ fc.classList.add('done'); if(skipped) fc.querySelector('.donebadge').textContent='已跳过'; }

/* ---------- 浮窗 / 设置 / toast ---------- */
const floater=$('#floater');
function openFloater(html){ floater.classList.remove('hidden'); if(html) $('#floater-body').innerHTML=html; }
function closeFloater(){ floater.classList.add('hidden'); }
const sheet=$('#sheet');
function openSettings(){ sheet.classList.add('open'); }
function closeSettings(){ sheet.classList.remove('open'); }
sheet.onclick=e=>{ if(e.target===sheet) closeSettings(); };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400); }

function saveConfig(){
  const base=$('#c-base').value, key=$('#c-key').value, model=$('#c-model').value;
  if(mode==='live' && key){
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({ai:{baseUrl:base,apiKey:key,model:model}})}).then(r=>r.json()).then(()=>toast('✓ 已保存并生效'));
  } else { toast('✓ 已保存'); }
  closeSettings();
}

/* 顶栏呼出：全局 mousemove 处理在文件底部（避免重复） */

/* ============================================================
   MOCK 模式 — 自动驾驶演示
   ============================================================ */
let demoBusy=false;
async function runDemo(){
  if(demoBusy) return; demoBusy=true;
  addUser('帮我规划一下这个项目的起步 —— 我要一个待办可视化。');
  await wait(500);
  const meta=addAi('好的，我先看一眼项目结构，再给方案。');
  const fold=addFold('🔧 读取工作区结构', 'call cap.workspace · list');
  setTimeout(()=>{ fold.querySelector('.fold').classList.add('live'); },100);
  await wait(1300);
  fold.querySelector('.fold').classList.remove('live');
  fold.querySelector('.fold span:last-child').textContent='✓ 工作区 14 个文件';
  await wait(400);

  const ai=addAi('看到了。建议做法：用 <code>cap.ui.window</code> 开一个轻量浮窗实时展示待办，数据落 <code>cap.kv</code>。我先拉一个表单让你填初始待办 →', '');
  ai.querySelector('.bubble').innerHTML='看到项目结构了。建议用 <b>cap.ui.window</b> 开一个实时待办浮窗，数据落 <code>cap.kv</code>。先拉个表单，把你手上的事记下来：';
  await wait(600);

  addFormDemo(ai);
}
function addFormDemo(owner){
  const fc=el('div','formcard');
  fc.title='添加待办';
  fc.innerHTML='<h4>添加待办</h4>'+
    '<div class="frow"><label>标题</label><input data-n="标题" placeholder="例如：星球日报"></div>'+
    '<div class="frow"><label>优先级</label><select data-n="优先级"><option>高</option><option>中</option><option>低</option></select></div>'+
    '<div class="frow"><label>备注</label><input data-n="备注"></div>'+
    '<div class="actions"><span class="donebadge">✓ 已完成</span><button class="btn" data-skip>跳过</button><button class="btn primary" data-sub>提交</button></div>';
  fc.querySelector('[data-skip]').onclick=()=>{ markDone(fc,true); };
  fc.querySelector('[data-sub]').onclick=()=>{
    const v={};
    fc.querySelectorAll('[data-n]').forEach(i=>v[i.dataset.n]=i.value);
    fc.classList.add('done');
    toast('✓ 已写入 cap.kv');
    setTimeout(()=>{
      const note=addAi('记下了。我已在后台把 <b>“'+(v['标题']||'待办')+'”</b> 写入 <code>cap.kv</code>，并打开实时待办浮窗。你可以随时对我说 “打开”/“停一下”。');
      note.querySelector('.bubble').innerHTML+='<div class="fold" style="margin-top:8px;pointer-events:none"><span class="chev">▶</span><span>✓ 已写入 cap.kv · 已广播 form-answered</span></div>';
      openFloater('<b>实时待办</b><ul><li>■ 实现星球日报 <span style="float:right;color:var(--ok)">● 高</span></li><li style="margin-top:6px">■ 设计登录态 <span style="float:right;color:var(--dim)">中</span></li></ul>');
      addFold('✓ 已调用 cap.ui.window', 'call cap.ui.window · open · id=todo-1');
    },600);
  };
  push(fc);
}
function addMessage(html){ addAi(html); }

setMode('demo');

/* ==================== 播放演示 ==================== */
function play(){ runDemo(); }

/* ==================== 输入发送(MOCK) ==================== */
async function send(){
  const t=$('#input').value.trim(); if(!t) return;
  $('#input').value=''; addUser(t);
  if(mode==='mock'){
    const m=addAi('正在处理…'); m.querySelector('.bubble').textContent='';
    await wait(500);
    m.querySelector('.bubble').textContent='这是「无声界面」原型 — 界面克制、动作可见。你可以点右下 ▶ Demo，或切换「连接后端」走真实 cap.*。';
  } else {
    if(!ws){ toast('未连接 WS'); return; }
    const streamId='s'+Date.now();
    const m=addAi(''); const fold=addFold('● 思考中…','call cap.ai.chat · stream:id');
    ws.send(JSON.stringify({type:'dispatch',cap:'cap.ai.chat',params:{messages:[{role:'user',content:t}],sessionId:undefined,stream:true},streamId}));
    // 简化：监听 chunk 事件
  }
  autoSize();
}

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
window.skySend = send;      // 输入框回车入口
window.playDemo = runDemo;  // Demo 入口
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&document.activeElement===$('#input')){e.preventDefault();send();} });

/* ==================== 模式切换 ==================== */
function setMode(m){
  mode=m;
  document.querySelectorAll('#modechip .pill').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  if(m==='live') connect();
  else if(ws){ try{ws.close()}catch{} ws=null; $('#status').textContent='原型模式'; }
}
window.setMode=setMode;
function connect(){
  if(ws) return;
  ws=new WebSocket('ws://localhost:9870/ws'+(token?'?token='+token:''));
  ws.onopen=()=>{ $('#status').textContent='在线'; };
  ws.onmessage=(ev)=>{ wsHandlers(ev); };
  ws.onclose=()=>{ $('#status').textContent='已断线，重连中…'; setTimeout(connect,2000); };
  ws.onerror=()=>{ $('#status').textContent='无法连接 9825'; };
}
function wsHandlers(ev){ /* 预留：接 cap.form/chunk 事件 */ }

/* 输入自适应高度 */
const inp=$('#input');
function autoSize(){ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,140)+'px'; }
inp.addEventListener('input',autoSize);

/* 呼出顶栏 —— 顶部 hover */
document.addEventListener('mousemove',e=>{ if(e.clientY<=4) document.body.classList.add('hoverTop'); else if(e.clientY>44) document.body.classList.remove('hoverTop'); });
</script>
</body>
</html>
