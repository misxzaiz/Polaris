<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>体素建筑工地沙盘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

canvas { display: block; }

.knob { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(145deg, #2a2a4a, #0e0e2a); border: 2px solid #4a4a7c; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #99b; font-size: 11px; user-select: none; transition: all 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08); }
.knob:hover { border-color: #7af; box-shadow: 0 4px 24px rgba(100,150,255,0.35); }
.knob:active { transform: scale(0.9); }
.knob .val { font-size: 14px; font-weight: bold; color: #7bf; margin-top: 2px; }
#info { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); color: #aab; font-size: 12px; background: rgba(8,8,28,0.75); padding: 8px 22px; border-radius: 20px; z-index: 10; pointer-events: none; backdrop-filter: blur(4px); }
#fps { position: fixed; top: 16px; right: 16px; color: #6d6; font-size: 12px; z-index: 10; }

</head>
<body>
<div id="info">🖱️ 拖拽环视 · 滚轮缩放 · 空格暴雨</div>
<div id="fps">60 FPS</div>

  <div class="knob" id="knobSpeed" onclick="toggleSpeed()">
    <span>⚙️</span><span class="val" id="speedVal">1×</span>
  </div>

    <span>🌗</span><span class="val" id="dayVal">ON</span>
  </div>
  <div class="knob" id="knobDust" onclick="toggleDust()">
    <span>💨</span><span class="val" id="dustVal">中</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ─── GLOBALS ───────────────────────────────────────────
let scene, camera, renderer, clock;
let sunLight, ambientLight, hemisphereLight;
let dustParticles, rainParticles;
let machines = [], workers = [], vehicles = [];
let cranes = [], excavators = [], trucks = [], mixers = [], loaders = [];
let dayNightTime = 0.3;
let dayCycleEnabled = true;
let speedMultiplier = 1;
let dustIntensity = 1;
let isRaining = false;
const DESK_W = 60, DESK_D = 40, DESK_H = 1.5;
const SITE_W = 48, SITE_D = 32;
let frameCount = 0, lastFpsTime = 0;

// ─── MATERIAL CACHE ────────────────────────────────────
const matCache = {};
function getMat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache[key]) {
    matCache[key] = new THREE.MeshStandardMaterial({
      color: new THREE.Color(color),
      roughness: opts.roughness ?? 0.85,
      metalness: opts.metalness ?? 0.05,
      flatShading: true,
      ...opts
    });
  }
  return matCache[key];
}

// ─── TEXTURE GENERATORS ────────────────────────────────
function makeWoodTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a3728'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 80; i++) {
    const y = Math.random() * 256;
    ctx.strokeStyle = `rgba(${60 + Math.random() * 40},${40 + Math.random() * 25},${20 + Math.random() * 15},${0.15 + Math.random() * 0.2})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath(); ctx.moveTo(0, y);
    for (let x = 0; x < 256; x += 10) ctx.lineTo(x, y + Math.sin(x * 0.05) * 3 + (Math.random() - 0.5) * 2);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 3);
  return tex;
}

function makeGroundTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5a4a30'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 800; i++) {
    const g = 60 + Math.random() * 50;
    ctx.fillStyle = `rgba(${g + 20},${g + 10},${g - 20},0.5)`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 3 + Math.random() * 5, 1 + Math.random() * 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 4);
  return tex;
}

// ─── CUSTOM SHADERS ────────────────────────────────────
const dustShader = {
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: new THREE.Color(0xc4a882) },
    uOpacity: { value: 0.6 }
  },
  vertexShader: `
    attribute float aSize;
    attribute float aPhase;
    uniform float uTime;
    uniform float uOpacity;
    varying float vAlpha;
    void main() {
      vec3 pos = position;
      pos.y += sin(uTime * 0.5 + aPhase) * 1.5;
      pos.x += cos(uTime * 0.3 + aPhase * 2.0) * 0.8;
      pos.z += sin(uTime * 0.4 + aPhase * 1.5) * 0.6;
      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = aSize * (200.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
      vAlpha = uOpacity * (0.3 + 0.7 * sin(uTime + aPhase) * sin(uTime + aPhase));
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if (d > 1.0) discard;
      float alpha = vAlpha * (1.0 - d * d * 0.5);
      gl_FragColor = vec4(uColor, alpha);
    }
  `
};

const rainShader = {
  uniforms: {
    uTime: { value: 0 },
    uOpacity: { value: 0.4 }
  },
  vertexShader: `
    attribute float aSpeed;
    attribute float aOffset;
    uniform float uTime;
    uniform float uOpacity;
    varying float vAlpha;
    void main() {
      vec3 pos = position;
      pos.y = mod(pos.y - uTime * aSpeed * 40.0 + aOffset, 80.0) - 40.0;
      pos.x += sin(uTime * 2.0 + aOffset) * 0.5;
      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = 2.0 * (100.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
      vAlpha = uOpacity;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      gl_FragColor = vec4(0.6, 0.7, 0.9, vAlpha);
    }
  `
};

// ─── SCENE SETUP ───────────────────────────────────────
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 22, 38);
  camera.lookAt(0, 2, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  ambientLight = new THREE.AmbientLight(0x404060, 0.4);
  scene.add(ambientLight);

  hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x3a2a1a, 0.3);
  scene.add(hemisphereLight);

  sunLight = new THREE.DirectionalLight(0xfff4e0, 1.5);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(1024, 1024);
  sunLight.shadow.camera.left = -40;
  sunLight.shadow.camera.right = 40;
  sunLight.shadow.camera.top = 30;
  sunLight.shadow.camera.bottom = -30;
  sunLight.shadow.camera.near = 1;
  sunLight.shadow.camera.far = 100;
  sunLight.shadow.bias = -0.001;
  scene.add(sunLight);

  buildDesk();
  buildSite();
  buildMachinery();
  buildWorkers();
  buildParticles();
  setupControls();
  animate();
}

// ─── DESK ──────────────────────────────────────────────
function buildDesk() {
  const woodTex = makeWoodTexture();
  const topGeo = new THREE.BoxGeometry(DESK_W, DESK_H, DESK_D);
  const topMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7, color: 0x5a3a20 });
  const top = new THREE.Mesh(topGeo, topMat);
  top.position.y = -DESK_H / 2;
  top.receiveShadow = true;
  scene.add(top);

  const trimMat = getMat(0x3a2010);
  const edges = [
    [DESK_W + 0.4, 0.3, 0.3, 0, -DESK_H - 0.15, -DESK_D / 2 - 0.15],
    [DESK_W + 0.4, 0.3, 0.3, 0, -DESK_H - 0.15, DESK_D / 2 + 0.15],
    [0.3, 0.3, DESK_D + 0.4, -DESK_W / 2 - 0.15, -DESK_H - 0.15, 0],
    [0.3, 0.3, DESK_D + 0.4, DESK_W / 2 + 0.15, -DESK_H - 0.15, 0],
  ];
  edges.forEach(([w, h, d, x, y, z]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), trimMat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    scene.add(m);
  });

  const legMat = getMat(0x3a2010);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 6, 1.2), legMat);
    leg.position.set(sx * (DESK_W / 2 - 1), -DESK_H - 3, sz * (DESK_D / 2 - 1));
    leg.castShadow = true;
    leg.receiveShadow = true;
    scene.add(leg);
  });

  buildDeskItems();

  const floorGeo = new THREE.PlaneGeometry(200, 200);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 1 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -8;
  floor.receiveShadow = true;
  scene.add(floor);
}

function buildDeskItems() {
  const deskTop = DESK_H / 2 + 0.01;

  // Blueprint scrolls (rolled paper)
  const bpMat = getMat(0x4488cc, { roughness: 0.6 });
  const bpWhite = getMat(0xeeddcc, { roughness: 0.8 });
  // Rolled blueprints
  for (let i = 0; i < 3; i++) {
    const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.2, 8), bpMat);
    roll.position.set(-25 + i * 0.4, deskTop + 0.15, -16 + i * 0.3);
    roll.rotation.z = Math.PI / 2;
    roll.castShadow = true;
    scene.add(roll);
  }
  // Unrolled blueprint
  const bpSheet = new THREE.Mesh(new THREE.BoxGeometry(3, 0.02, 2), bpWhite);
  bpSheet.position.set(-22, deskTop + 0.01, -14);
  bpSheet.receiveShadow = true;
  scene.add(bpSheet);
  // Blueprint drawing lines
  for (let i = 0; i < 8; i++) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.03, 0.03), bpMat);
    line.position.set(-22, deskTop + 0.03, -14.5 + i * 0.25);
    scene.add(line);
  }

  // Steel tape measure
  const tapeCase = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.6), getMat(0xddaa00, { metalness: 0.6 }));
  tapeCase.position.set(-20, deskTop + 0.075, -15);
  tapeCase.castShadow = true;
  scene.add(tapeCase);
  // Tape extending out
  const tapeStrip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 1.5), getMat(0xcccc44, { metalness: 0.7 }));
  tapeStrip.position.set(-20, deskTop + 0.01, -13.3);
  scene.add(tapeStrip);
  // Tape markings
  for (let i = 0; i < 6; i++) {
    const mark = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.03, 0.04), getMat(0x222222));
    mark.position.set(-20, deskTop + 0.03, -13.2 + i * 0.2);
    scene.add(mark);
  }

  // Safety helmet (yellow)
  const helmetBowl = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2), getMat(0xffff00));
  helmetBowl.position.set(22, deskTop + 0.2, 14);
  helmetBowl.castShadow = true;
  scene.add(helmetBowl);
  const helmetRidge = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.7), getMat(0xffff00));
  helmetRidge.position.set(22, deskTop + 0.42, 14);
  helmetRidge.castShadow = true;
  scene.add(helmetRidge);
  const helmetBrim = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.2), getMat(0xffff00));
  helmetBrim.position.set(22, deskTop + 0.22, 14.35);
  helmetBrim.castShadow = true;
  scene.add(helmetBrim);

  // Metal spirit level
  const levelBody = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.25, 0.4), getMat(0x888888, { metalness: 0.7 }));
  levelBody.position.set(20, deskTop + 0.125, 12);
  levelBody.rotation.y = 0.15;
  levelBody.castShadow = true;
  scene.add(levelBody);
  // Vial
  const vial = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.6, 6), getMat(0x88ff88, { transparent: true, opacity: 0.7 }));
  vial.position.set(20, deskTop + 0.27, 12);
  vial.rotation.z = Math.PI / 2;
  vial.rotation.y = 0.15;
  scene.add(vial);
  // End caps
  const capMat = getMat(0xff4400, { metalness: 0.5 });
  [-1.2, 1.2].forEach(offset => {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.05, 6), capMat);
    cap.position.set(20 + offset * Math.cos(0.15), deskTop + 0.125, 12 + offset * Math.sin(0.15));
    cap.rotation.x = Math.PI / 2;
    scene.add(cap);
  });

  // Pencil
  const pencil = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.5, 6), getMat(0x2288ff));
  pencil.position.set(21, deskTop + 0.03, 13);
  pencil.rotation.z = Math.PI / 2;
  pencil.rotation.y = 0.3;
  scene.add(pencil);
  // Pencil tip
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.15, 6), getMat(0xffddaa));
  tip.position.set(21.75, deskTop + 0.03, 13.15);
  tip.rotation.z = Math.PI / 2;
  tip.rotation.y = 0.3;
  scene.add(tip);

  // Coffee cup
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.18, 0.35, 8), getMat(0xffffff));
  cup.position.set(-18, deskTop + 0.175, 16);
  cup.castShadow = true;
  scene.add(cup);
  // Cup handle
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.02, 4, 8, Math.PI), getMat(0xffffff));
  handle.position.set(-18, deskTop + 0.2, 16.18);
  scene.add(handle);

  // Small toolbox
  const toolbox = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 0.6), getMat(0xcc2200));
  toolbox.position.set(15, deskTop + 0.25, -16);
  toolbox.castShadow = true;
  scene.add(toolbox);
  const toolboxLid = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.6), getMat(0xaa1100));
  toolboxLid.position.set(15, deskTop + 0.54, -16);
  toolboxLid.castShadow = true;
  scene.add(toolboxLid);
  const toolboxLatch = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.05), getMat(0x888888, { metalness: 0.7 }));
  toolboxLatch.position.set(15, deskTop + 0.35, -15.7);
  scene.add(toolboxLatch);
}

// ─── CONSTRUCTION SITE ─────────────────────────────────
function buildSite() {
  const groundGeo = new THREE.PlaneGeometry(SITE_W + 4, SITE_D + 4);
  const groundTex = makeGroundTexture();
  const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95, color: 0x8a7a5a });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  const grassMat = getMat(0x4a7a3a, { roughness: 1 });
  const grassGeo = new THREE.RingGeometry(SITE_W / 2 + 1, SITE_W / 2 + 4, 4);
  const grass = new THREE.Mesh(grassGeo, grassMat);
  grass.rotation.x = -Math.PI / 2;
  grass.position.y = 0.02;
  scene.add(grass);

  buildExcavationZone();
  buildRebarShed();
  buildMaterialYard();
  buildBuildingFoundation();
  buildOfficeArea();
  buildDebrisArea();
  buildRoads();
  buildFences();
  buildDetails();
}

function buildExcavationZone() {
  const px = -14, pz = -6, pw = 12, pd = 10;
  const groundMat2 = getMat(0x6a5a3a);

  // Pit bottom
  for (let x = Math.floor(px) + 1; x < Math.ceil(px + pw) - 1; x++) {
    for (let z = Math.floor(pz) + 1; z < Math.ceil(pz + pd) - 1; z++) {
      const geo = new THREE.BoxGeometry(0.9, 0.3, 0.9);
      const mesh = new THREE.Mesh(geo, getMat(0x3a2a10));
      mesh.position.set(x, -0.15, z);
      mesh.receiveShadow = true;
      scene.add(mesh);
    }
  }

  // Dirt fill below
  for (let x = Math.floor(px); x < Math.ceil(px + pw); x++) {
    for (let z = Math.floor(pz); z < Math.ceil(pz + pd); z++) {
      const geo = new THREE.BoxGeometry(0.9, 1.2, 0.9);
      const mesh = new THREE.Mesh(geo, getMat(0x5a4020));
      mesh.position.set(x, -0.9, z);
      mesh.receiveShadow = true;
      scene.add(mesh);
    }
  }

  // Sloped sides
  const slopeH = 3;
  for (let s = 1; s <= slopeH; s++) {
    const ox = s * 0.5, oz = s * 0.4;
    for (let x = Math.floor(px - ox); x < Math.ceil(px + pw + ox); x++) {
      for (let z = Math.floor(pz - oz); z < Math.ceil(pz + pd + oz); z++) {
        const geo = new THREE.BoxGeometry(0.9, 0.4, 0.9);
        const mesh = new THREE.Mesh(geo, getMat(0x6a5030));
        mesh.position.set(x, -s * 0.5 + 0.2, z);
        mesh.receiveShadow = true;
        scene.add(mesh);
      }
    }
  }

  // Loose dirt pile
  for (let i = 0; i < 40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 1 + Math.random() * 2;
    const hx = px + pw + 2 + Math.cos(angle) * r;
    const hz = pz + pd / 2 + Math.sin(angle) * r;
    const hy = Math.random() * 1.5;
    const size = 0.4 + Math.random() * 0.5;
    const geo = new THREE.BoxGeometry(size, size * 0.6, size);
    const mesh = new THREE.Mesh(geo, getMat(0x7a6040));
    mesh.position.set(hx, hy + 0.2, hz);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }

  // Safety barriers
  const barrierMat = getMat(0xff6600);
  const barrierWhite = getMat(0xffffff);
  for (let i = 0; i < 8; i++) {
    const bx = px - 1.5 + i * 1.8;
    const bz = pz - 0.5;
    const geo = new THREE.BoxGeometry(1.5, 0.8, 0.15);
    const mat = i % 2 === 0 ? barrierMat : barrierWhite;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(bx, 0.4, bz);
    mesh.castShadow = true;
    scene.add(mesh);
  }

  // Vertical posts for barrier
  for (let i = 0; i <= 8; i++) {
    const bx = px - 1.5 + i * 1.8;
    const bz = pz - 0.5;
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), getMat(0x888888, { metalness: 0.5 }));
    post.position.set(bx, 0.4, bz);
    post.castShadow = true;
    scene.add(post);
  }
}

function buildRebarShed() {
  const sx = -18, sz = 8;

  // Floor
  const floorGeo = new THREE.BoxGeometry(8, 0.2, 6);
  const floorMesh = new THREE.Mesh(floorGeo, getMat(0x8a7a6a));
  floorMesh.position.set(sx + 3.5, 0.1, sz + 2.5);
  floorMesh.receiveShadow = true;
  scene.add(floorMesh);

  // Columns
  const colMat = getMat(0x666666, { metalness: 0.5 });
  [[0, 0], [0, 5], [7, 0], [7, 5]].forEach(([cx, cz]) => {
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4, 0.3), colMat);
    col.position.set(sx + cx + 0.15, 2.1, sz + cz + 0.15);
    col.castShadow = true;
    scene.add(col);
  });

  // Roof
  const roofGeo = new THREE.BoxGeometry(8.5, 0.15, 6.5);
  const roofMat = getMat(0xcc4400, { roughness: 0.6 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(sx + 3.5, 4.2, sz + 2.5);
  roof.castShadow = true;
  roof.receiveShadow = true;
  scene.add(roof);

  // Rebar stacks
  for (let i = 0; i < 5; i++) {
    const rx = sx + 1 + Math.random() * 5;
    const rz = sz + 0.5 + Math.random() * 4;
    for (let j = 0; j < 6 + Math.floor(Math.random() * 8); j++) {
      const rLen = 3 + Math.random() * 3;
      const rb = new THREE.Mesh(
        new THREE.BoxGeometry(rLen, 0.08, 0.08),
        getMat(0x884422, { metalness: 0.7, roughness: 0.4 })
      );
      rb.position.set(rx, 0.25 + j * 0.12, rz + Math.random() * 0.3 - 0.15);
      rb.rotation.y = Math.random() * 0.2;
      rb.castShadow = true;
      scene.add(rb);
    }
  }

  // Work bench
  const bench = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 1), getMat(0x6a4a2a));

function buildExcavator(x, y, z, rotation, name) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.rotation.y = rotation;
  group.userData = { type: 'excavator', name };

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 2), getMat(0xddaa00));
  body.position.y = 1.2;
  body.castShadow = true;
  group.add(body);

  // Cabin
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 1.2), getMat(0xcc9900));
  cabin.position.set(0.5, 2.2, 0.3);
  cabin.castShadow = true;
  group.add(cabin);

  // Window
  const winMat = getMat(0x88ccff, { transparent: true, opacity: 0.6 });
  const win = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.6, 0.5), winMat);
  win.position.set(1.01, 2.3, 0.3);
  group.add(win);

  // Tracks
  const trackMat = getMat(0x333333, { roughness: 0.9 });
  const trackL = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.6, 0.8), trackMat);
  trackL.position.set(0, 0.5, 0.9);
  trackL.castShadow = true;
  group.add(trackL);
  const trackR = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.6, 0.8), trackMat);
  trackR.position.set(0, 0.5, -0.9);
  trackR.castShadow = true;
  group.add(trackR);

  // Arm pivot
  const armPivot = new THREE.Group();
  armPivot.position.set(-1.2, 1.5, 0);
  group.add(armPivot);

  // Upper arm
  const upperArm = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.4, 0.4), getMat(0xddaa00));
  upperArm.position.x = 1;
  upperArm.castShadow = true;
  armPivot.add(upperArm);

  // Lower pivot
  const lowerPivot = new THREE.Group();
  lowerPivot.position.set(2.3, 0, 0);
  armPivot.add(lowerPivot);

  // Lower arm
  const lowerArm = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.3), getMat(0xddaa00));
  lowerArm.position.x = 0.9;
  lowerArm.castShadow = true;
  lowerPivot.add(lowerArm);

  // Bucket
  const bucket = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.7), getMat(0x888888, { metalness: 0.5 }));
  bucket.position.set(1.8, -0.1, 0);
  bucket.castShadow = true;
  lowerPivot.add(bucket);

  // Bucket teeth
  for (let i = -1; i <= 1; i++) {
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), getMat(0x666666));
    tooth.position.set(2.1, -0.1, i * 0.25);
    lowerPivot.add(tooth);
  }

  group.userData.armPivot = armPivot;
  group.userData.lowerPivot = lowerPivot;
  group.userData.bucket = bucket;

  scene.add(group);
  excavators.push(group);
  machines.push(group);
}

function buildTowerCrane(x, y, z) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.userData = { type: 'crane' };

  // Base
  const base = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 2), getMat(0x888888, { metalness: 0.4 }));
  base.position.y = 0.25;
  base.castShadow = true;
  group.add(base);

  // Tower mast
  const mast = new THREE.Mesh(new THREE.BoxGeometry(0.8, 14, 0.8), getMat(0xddcc00));
  mast.position.y = 7.5;
  mast.castShadow = true;
  group.add(mast);

  // Lattice details
  for (let i = 0; i < 14; i++) {
    const lat = new THREE.Mesh(new THREE.BoxGeometry(1, 0.08, 1), getMat(0xccbb00));
    lat.position.y = 0.5 + i;
    group.add(lat);
    const lat2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1, 0.08), getMat(0xccbb00));
    lat2.position.y = 1 + i;
    group.add(lat2);
  }

  // Counter-jib
  const counterJib = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, 0.8), getMat(0xddcc00));
  counterJib.position.set(-2.5, 14.5, 0);
  counterJib.castShadow = true;
  group.add(counterJib);

  // Counter weight
  const cw = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), getMat(0x666666, { metalness: 0.6 }));
  cw.position.set(-4.5, 14.5, 0);
  group.add(cw);

  // Jib
  const jib = new THREE.Mesh(new THREE.BoxGeometry(10, 0.5, 1), getMat(0xddcc00));
  jib.position.set(3, 14.5, 0);
  jib.castShadow = true;
  group.add(jib);
  group.userData.jib = jib;

  // Trolley
  const trolley = new THREE.Group();
  trolley.position.set(5, 14.2, 0);
  jib.add(trolley);
  group.userData.trolley = trolley;

  // Cable
  const cablePoints = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -3, 0)];
  const cableGeo = new THREE.BufferGeometry().setFromPoints(cablePoints);
  const cable = new THREE.Line(cableGeo, new THREE.LineBasicMaterial({ color: 0x333333 }));
  trolley.add(cable);

  // Hook/load
  const hook = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6), getMat(0x888888, { metalness: 0.5 }));
  hook.position.y = -3.3;
  trolley.add(hook);
  group.userData.hook = hook;

  // Cabin
  const craneCabin = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1), getMat(0x2255aa));
  craneCabin.position.set(0, 13.5, 0.5);
  craneCabin.castShadow = true;
  group.add(craneCabin);

  // Light on top

function createWorker(seed) {
  const g = new THREE.Group();
  const skinColors = [0xd4a574, 0xc68642, 0x8d5524, 0xe0ac69];
  const skinColor = skinColors[seed % skinColors.length];
  const uniformColors = [0xff6600, 0x4488ff, 0x22aa44, 0xffcc00, 0xff4444];
  const uniformColor = uniformColors[seed % uniformColors.length];

  const bodyMat = getMat(uniformColor);
  const skinMat = getMat(skinColor);
  const pantsMat = getMat(0x334466);
  const helmetMat = getMat(0xffff00);

  // Legs
  const legGeo = new THREE.BoxGeometry(0.2, 0.5, 0.2);
  const leftLeg = new THREE.Mesh(legGeo, pantsMat);
  leftLeg.position.set(-0.12, 0.25, 0);
  g.add(leftLeg);
  const rightLeg = new THREE.Mesh(legGeo, pantsMat);
  rightLeg.position.set(0.12, 0.25, 0);
  g.add(rightLeg);

  // Body
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.25), bodyMat);
  torso.position.y = 0.7;
  g.add(torso);

  // Arms
  const armGeo = new THREE.BoxGeometry(0.15, 0.45, 0.15);
  const leftArm = new THREE.Mesh(armGeo, bodyMat);
  leftArm.position.set(-0.3, 0.75, 0);
  g.add(leftArm);
  const rightArm = new THREE.Mesh(armGeo, bodyMat);
  rightArm.position.set(0.3, 0.75, 0);
  g.add(rightArm);

  // Head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), skinMat);
  head.position.y = 1.05;
  g.add(head);

  // Hard hat
  const hatBrim = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.05, 0.35), helmetMat);
  hatBrim.position.y = 1.2;
  g.add(hatBrim);
  const hatTop = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.12, 0.28), helmetMat);
  hatTop.position.y = 1.28;
  g.add(hatTop);

  // Save references to userData
  g.userData.leftLeg = leftLeg;
  g.userData.rightLeg = rightLeg;
  g.userData.leftArm = leftArm;
  g.userData.rightArm = rightArm;
  g.userData.head = head;
  g.userData.hatBrim = hatBrim;
  g.userData.hatTop = hatTop;

  return g;
}

// ─── PARTICLES ─────────────────────────────────────────
function buildParticles() {
  // Dust particles
  const dustCount = 150;
  const dustGeo = new THREE.BufferGeometry();
  const dustPositions = new Float32Array(dustCount * 3);
  const dustSizes = new Float32Array(dustCount);
  const dustPhases = new Float32Array(dustCount);

  for (let i = 0; i < dustCount; i++) {
    dustPositions[i * 3] = (Math.random() - 0.5) * SITE_W * 0.8;
    dustPositions[i * 3 + 1] = Math.random() * 4 + 0.5;
    dustPositions[i * 3 + 2] = (Math.random() - 0.5) * SITE_D * 0.7;
    dustSizes[i] = 0.5 + Math.random() * 1.5;
    dustPhases[i] = Math.random() * Math.PI * 2;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
  dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dustSizes, 1));
  dustGeo.setAttribute('aPhase', new THREE.BufferAttribute(dustPhases, 1));

  const dustMat = new THREE.ShaderMaterial({
    ...dustShader,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  dustParticles = new THREE.Points(dustGeo, dustMat);
  scene.add(dustParticles);

  // Rain particles
  const rainCount = 2000;
  const rainGeo = new THREE.BufferGeometry();
  const rainPositions = new Float32Array(rainCount * 3);
  const rainSpeeds = new Float32Array(rainCount);
  const rainOffsets = new Float32Array(rainCount);

  for (let i = 0; i < rainCount; i++) {
    rainPositions[i * 3] = (Math.random() - 0.5) * 80;
    rainPositions[i * 3 + 1] = Math.random() * 60;
    rainPositions[i * 3 + 2] = (Math.random() - 0.5) * 60;
    rainSpeeds[i] = 0.8 + Math.random() * 0.4;
    rainOffsets[i] = Math.random() * Math.PI * 2;
  }
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
  rainGeo.setAttribute('aSpeed', new THREE.BufferAttribute(rainSpeeds, 1));
  rainGeo.setAttribute('aOffset', new THREE.BufferAttribute(rainOffsets, 1));

  const rainMat = new THREE.ShaderMaterial({
    ...rainShader,
    transparent: true,
    depthWrite: false
  });
  rainParticles = new THREE.Points(rainGeo, rainMat);
  rainParticles.visible = false;
  scene.add(rainParticles);
}

// ─── CONTROLS ──────────────────────────────────────────
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0, phi: Math.PI / 4, radius: 38 };
let autoRotate = true;
let idleTimer = 0;

function setupControls() {
  const canvas = renderer.domElement;
  canvas.addEventListener('mousedown', e => {
    isDragging = true;
    autoRotate = false;
    idleTimer = 0;
    prevMouse.x = e.clientX;
    prevMouse.y = e.clientY;
  });
  canvas.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevMouse.x;
    const dy = e.clientY - prevMouse.y;
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, spherical.phi + dy * 0.005));
    prevMouse.x = e.clientX;
    prevMouse.y = e.clientY;
  });
  canvas.addEventListener('mouseup', () => { isDragging = false; });
  canvas.addEventListener('mouseleave', () => { isDragging = false; });
  canvas.addEventListener('wheel', e => {
    spherical.radius = Math.max(15, Math.min(60, spherical.radius + e.deltaY * 0.03));
    autoRotate = false;
    idleTimer = 0;
  });

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      autoRotate = false;
      idleTimer = 0;
      prevMouse.x = e.touches[0].clientX;
      prevMouse.y = e.touches[0].clientY;
    }
  });
  canvas.addEventListener('touchmove', e => {
    if (!isDragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - prevMouse.x;
    const dy = e.touches[0].clientY - prevMouse.y;
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, spherical.phi + dy * 0.005));
    prevMouse.x = e.touches[0].clientX;
    prevMouse.y = e.touches[0].clientY;
  });
  canvas.addEventListener('touchend', () => { isDragging = false; });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      isRaining = !isRaining;
      rainParticles.visible = isRaining;
      document.getElementById('info').textContent = isRaining ? '🌧️ 暴雨中 - 按空格关闭' : '🖱️ 拖拽环视 · 滚轮缩放 · 空格暴雨';
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ─── ANIMATION ─────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05) * speedMultiplier;
  const time = clock.getElapsedTime();

  updateFPS(time);
  updateDayNight(time, dt);
  updateCamera(dt);
  updateMachines(time, dt);
  updateWorkers(time, dt);
  updateDust(time, dt);
  updateRain(time, dt);
  updateLights(time);

  renderer.render(scene, camera);
}

function updateFPS(t) {
  frameCount++;
  if (t - lastFpsTime >= 0.5) {
    const fps = Math.round(frameCount / (t - lastFpsTime));
    document.getElementById('fps').textContent = fps + ' FPS';
    frameCount = 0;
    lastFpsTime = t;
  }
}

function updateDayNight(time, dt) {
  if (dayCycleEnabled) {
    dayNightTime = (dayNightTime + dt * 0.02) % 1;
  }

  const t = dayNightTime;
  let skyColor, sunIntensity, period;

  if (t < 0.2) {
    skyColor = new THREE.Color(0x0a0a1a);
    sunIntensity = 0.05;
    period = '🌙 深夜';
  } else if (t < 0.28) {
    skyColor = lerpColor(new THREE.Color(0x0a0a1a), new THREE.Color(0xff8844), (t - 0.2) / 0.08);
    sunIntensity = 0.3 + (t - 0.2) / 0.08 * 0.5;
    period = '🌅 黎明';
  } else if (t < 0.45) {
    skyColor = lerpColor(new THREE.Color(0xff8844), new THREE.Color(0x87CEEB), (t - 0.28) / 0.17);
    sunIntensity = 0.8 + (t - 0.28) / 0.17 * 0.5;
    period = '☀️ 上午';
  } else if (t < 0.55) {
    skyColor = new THREE.Color(0x87CEEB);
    sunIntensity = 1.3;
    period = '☀️ 正午';
  } else if (t < 0.72) {
    skyColor = lerpColor(new THREE.Color(0x87CEEB), new THREE.Color(0xff6633), (t - 0.55) / 0.17);
    sunIntensity = 1.3 - (t - 0.55) / 0.17 * 0.5;
    period = '🌤️ 下午';
  } else if (t < 0.8) {
    skyColor = lerpColor(new THREE.Color(0xff6633), new THREE.Color(0x1a0a2e), (t - 0.72) / 0.08);
    sunIntensity = 0.8 - (t - 0.72) / 0.08 * 0.7;
    period = '🌇 黄昏';
  } else {
    skyColor = new THREE.Color(0x0a0a1a);
    sunIntensity = 0.05;
    period = '🌙 深夜';
  }

  scene.background = skyColor;
  scene.fog.color = skyColor;

  const sunAngle = t * Math.PI * 2 - Math.PI / 2;
  sunLight.position.set(Math.cos(sunAngle) * 30, Math.sin(sunAngle) * 25 + 5, 10);
  sunLight.intensity = sunIntensity;
  sunLight.color.setHSL(0.1, 0.6, 0.5 + sunIntensity * 0.3);

  ambientLight.intensity = 0.15 + sunIntensity * 0.25;
  hemisphereLight.intensity = 0.1 + sunIntensity * 0.2;

  document.getElementById('dayLabel').textContent = period;
}

function lerpColor(c1, c2, t) {
  return c1.clone().lerp(c2, Math.max(0, Math.min(1, t)));
}

function updateCamera(dt) {
  if (autoRotate && !isDragging) {
    idleTimer += dt;
    if (idleTimer > 3) {
      spherical.theta += dt * 0.08;
    }
  }

  camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.position.y = spherical.radius * Math.cos(spherical.phi);
  camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.lookAt(0, 2, 0);
}

function updateMachines(time, dt) {
  // Excavators
  excavators.forEach((ex, i) => {
    const phase = time * 1.5 + i * 2;
    const armPivot = ex.userData.armPivot;
    const lowerPivot = ex.userData.lowerPivot;
    if (armPivot) armPivot.rotation.x = Math.sin(phase) * 0.5 - 0.3;
    if (lowerPivot) lowerPivot.rotation.x = Math.sin(phase * 1.3 + 1) * 0.6 - 0.2;
    if (ex.userData.bucket) ex.userData.bucket.rotation.x = Math.sin(phase * 1.5 + 2) * 0.3;
  });

  // Tower cranes
  cranes.forEach((crane, i) => {
    const phase = time * 0.3 + i * 3;
    if (crane.userData.jib) crane.userData.jib.rotation.y = Math.sin(phase) * 0.8;
    if (crane.userData.trolley) crane.userData.trolley.position.x = 3 + Math.sin(phase * 1.5) * 4;
    if (crane.userData.hook) {
      const hookSwing = Math.sin(phase * 2) * 0.3;
      crane.userData.hook.position.x = Math.sin(hookSwing) * 0.5;
      crane.userData.hook.position.y = -3 + Math.sin(phase * 1.7) * 0.5;
    }
  });

  // Dump trucks
  trucks.forEach((truck, i) => {
    const phase = time * truck.userData.speed * 0.15 + i * Math.PI;
    const radius = 8 + i * 3;
    const tx = Math.cos(phase) * radius;
    const tz = Math.sin(phase) * radius * 0.6 - 2;
    truck.position.x = Math.max(-SITE_W / 2 + 2, Math.min(SITE_W / 2 - 2, tx));
    truck.position.z = Math.max(-SITE_D / 2 + 1, Math.min(SITE_D / 2 - 1, tz));
    truck.rotation.y = -phase + Math.PI / 2;
  });

  // Concrete mixers
  mixers.forEach((m, i) => {
    const phase = time * m.userData.speed * 0.1 + i * 2;
    const rx = Math.cos(phase) * 12;
    const rz = Math.sin(phase) * 8 + 5;
    m.position.x = Math.max(-SITE_W / 2 + 3, Math.min(SITE_W / 2 - 3, rx));
    m.position.z = Math.max(-SITE_D / 2 + 2, Math.min(SITE_D / 2 - 2, rz));
    m.rotation.y = -phase + Math.PI / 2;
    if (m.userData.drum) m.userData.drum.rotation.x = time * 2;
  });

  // Loaders
  loaders.forEach((ld, i) => {
    const phase = time * ld.userData.speed * 0.2 + i * 1.5;
    ld.position.x = Math.sin(phase) * 10;
    ld.position.z = Math.cos(phase * 0.7) * 6 + 5;
    ld.rotation.y = Math.cos(phase) * 0.5;
  });
}

function updateWorkers(time, dt) {
  workers.forEach((w, i) => {
    const d = w.userData;
    const phase = time * 2 + d.phase;
    const ll = d.leftLeg, rl = d.rightLeg, la = d.leftArm, ra = d.rightArm, hd = d.head;

    switch (d.action) {
      case 'rebar':
        if (la) la.rotation.x = Math.sin(phase) * 0.5;
        if (ra) ra.rotation.x = Math.sin(phase + 1) * 0.5;
        w.position.x = d.baseX + Math.sin(phase * 0.5) * 0.5;
        break;
      case 'carry':
        w.position.x = d.baseX + Math.sin(phase) * 2;
        w.position.z = d.baseZ + Math.cos(phase * 0.7) * 1;
        if (ll) ll.rotation.x = Math.sin(phase) * 0.4;
        if (rl) rl.rotation.x = Math.sin(phase + Math.PI) * 0.4;
        if (la) la.rotation.x = Math.sin(phase + Math.PI) * 0.3;
        if (ra) ra.rotation.x = Math.sin(phase) * 0.3;
        w.rotation.y = Math.cos(phase) > 0 ? 0 : Math.PI;
        break;
      case 'signal':
        if (ra) { ra.rotation.z = -Math.PI / 2 + Math.sin(phase) * 0.5; ra.rotation.x = Math.sin(phase * 0.5) * 0.3; }
        break;
      case 'walk':
        w.position.x = d.baseX + Math.sin(phase * 0.8) * 3;
        w.position.z = d.baseZ + Math.cos(phase * 0.6) * 2;
        if (ll) ll.rotation.x = Math.sin(phase) * 0.5;
        if (rl) rl.rotation.x = Math.sin(phase + Math.PI) * 0.5;
        if (la) la.rotation.x = Math.sin(phase + Math.PI) * 0.4;
        if (ra) ra.rotation.x = Math.sin(phase) * 0.4;
        break;
      case 'patrol':
        w.position.x = d.baseX + Math.sin(phase * 0.5) * 5;
        w.position.z = d.baseZ + Math.cos(phase * 0.3) * 3;
        if (ll) ll.rotation.x = Math.sin(phase * 0.5) * 0.3;
        if (rl) rl.rotation.x = Math.sin(phase * 0.5 + Math.PI) * 0.3;
        break;
      case 'work':
        if (hd) hd.rotation.x = Math.sin(phase) * 0.2;
        if (ra) ra.rotation.x = Math.sin(phase * 2) * 0.4 - 0.5;
        if (la) la.rotation.x = Math.sin(phase * 2 + 1) * 0.3;
        break;
      case 'drill':
        if (ra) ra.rotation.x = -0.5 + Math.sin(phase * 3) * 0.3;
        if (la) la.rotation.x = Math.sin(phase * 2) * 0.2;
        w.position.x = d.baseX + Math.sin(phase) * 0.3;
        break;
      case 'stand':
      default:
        if (hd) hd.position.y = 1.05 + Math.sin(phase * 0.5) * 0.02;
        if (la) la.rotation.x = Math.sin(phase * 0.3) * 0.05;
        if (ra) ra.rotation.x = Math.sin(phase * 0.3 + 1) * 0.05;
        break;
    }
  });
}

function updateDust(time, dt) {
  if (dustParticles) {
    dustParticles.material.uniforms.uTime.value = time;
    dustParticles.material.uniforms.uOpacity.value = 0.25 * dustIntensity;
    const positions = dustParticles.geometry.attributes.position.array;
    for (let i = 0; i < positions.length; i += 3) {
      if (Math.random() < 0.01 * dustIntensity) {
        positions[i] = (Math.random() - 0.5) * SITE_W * 0.7 - 3;
        positions[i + 1] = Math.random() * 3 + 0.3;
        positions[i + 2] = (Math.random() - 0.5) * SITE_D * 0.6 - 2;
      }
    }
    dustParticles.geometry.attributes.position.needsUpdate = true;
  }
}

function updateRain(time, dt) {
  if (rainParticles && isRaining) {
    rainParticles.material.uniforms.uTime.value = time;
    rainParticles.material.uniforms.uOpacity.value = 0.5;
  }
}

function updateLights(time) {
  const isNight = dayNightTime > 0.75 || dayNightTime < 0.2;
  const isDusk = (dayNightTime > 0.7 && dayNightTime < 0.85) || (dayNightTime > 0.15 && dayNightTime < 0.3);
  const lightIntensity = (isNight || isDusk) ? (isNight ? 1.5 : 0.8) : 0;

  scene.traverse(obj => {
    if (obj.userData && obj.userData.isLight) {
      if (obj.isMesh && obj.material) {
        obj.material.emissiveIntensity = lightIntensity;
      } else if (obj.isPointLight) {
        obj.intensity = lightIntensity;
      }
    }
    if (obj.userData && obj.userData.isWindow && obj.material) {
      obj.material.emissiveIntensity = lightIntensity * 0.8;
    }
    if (obj.userData && obj.userData.isFlag && obj.isMesh) {
      obj.rotation.y = Math.sin(time * 2 + obj.position.x) * 0.3;
    }
  });
}

// ─── UI CONTROLS ───────────────────────────────────────
window.toggleSpeed = function () {
  const speeds = [0.5, 1, 2, 4];
  const idx = speeds.indexOf(speedMultiplier);
  speedMultiplier = speeds[(idx + 1) % speeds.length];
  document.getElementById('speedVal').textContent = speedMultiplier + '×';
};

window.toggleDay = function () {
  dayCycleEnabled = !dayCycleEnabled;
  document.getElementById('dayVal').textContent = dayCycleEnabled ? 'ON' : 'OFF';
};

window.toggleDust = function () {
  const levels = [0, 0.5, 1, 2];
  const labels = ['关', '低', '中', '高'];
  const idx = levels.indexOf(dustIntensity);
  dustIntensity = levels[(idx + 1) % levels.length];
  document.getElementById('dustVal').textContent = labels[(idx + 1) % labels.length];
};

// ─── START ─────────────────────────────────────────────
init();
</script>
