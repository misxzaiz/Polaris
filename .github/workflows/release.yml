name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
          - platform: ubuntu-22.04
            target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ---- 依赖锁定守卫（编译前早停）----
      # src-tauri/Cargo.lock 必须入库且与 Cargo.toml 一致。若缺失或漂移，cargo 会从零解析
      # 依赖，`tauri = "2.0"` / `tauri-plugin-dialog = "2.7"` 等宽松区间会浮到 crates.io 最新版
      # （tauri 2.12.0 / dialog 2.8.0 / process 2.4.0 / opener 2.6.0），而 pnpm-lock 把 JS 侧钉死在
      # 2.11.x，`tauri build` 的版本一致性校验随即硬失败——v10.5.7 的桌面端构建即因此挂掉，
      # 而 Release Web / Release APK 不触发该校验，照常通过，极易误判为"只是桌面端偶发失败"。
      - name: Verify Rust dependency lock
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch src-tauri/Cargo.lock >/dev/null 2>&1; then
            echo "ERROR: src-tauri/Cargo.lock 未被 git 跟踪。"
            echo "CI 为全新克隆，无锁文件时 cargo 从零解析依赖会浮到最新版，与 pnpm-lock 钉死的 JS 侧版本不一致，"
            echo "tauri build 必然失败。"
            echo "处理：本地 cd src-tauri && cargo generate-lockfile，然后 git add src-tauri/Cargo.lock 重新提交；"
            echo "并检查 .gitignore 是否排除了该文件（历史上被 /src-tauri/Cargo.lock 排除过）。"
            exit 1
          fi
          (cd src-tauri && cargo metadata --locked --format-version 1 >/dev/null)
          echo "Cargo.lock 已入库且与 Cargo.toml 一致"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Build MCP binary
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin polaris-mcp

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG=$(git tag --sort=-creatordate --list "v*.*.*" | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..${GITHUB_REF_NAME}")
          else
            COMMITS=$(git log --oneline -30)
          fi

          features=""
          fixes=""
          others=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # 分类：feat / fix / refactor / docs / chore / perf / ...
            if echo "$line" | grep -qE "^(feat|feat\(.*\)):"; then
              features="${features}  - ${line}\n"
            elif echo "$line" | grep -qE "^(fix|fix\(.*\)):"; then
              fixes="${fixes}  - ${line}\n"
            elif echo "$line" | grep -qE "^(perf|refactor|docs|chore|revert|style|ci|test|build):"; then
              others="${others}  - ${line}\n"
            else
              others="${others}  - ${line}\n"
            fi
          done <<< "$COMMITS"

          cat > release_notes.md << NOTES_EOF
          # Polaris $VERSION 发布说明

          本次发布包含 Tauri 桌面端 + Web 独立服务双端产物。

          NOTES_EOF

          if [ -n "$features" ]; then
            echo "## 新增功能" >> release_notes.md
            echo "" >> release_notes.md
            echo -e "$features" >> release_notes.md
            echo "" >> release_notes.md
          fi
          if [ -n "$fixes" ]; then
            echo "## 修复问题" >> release_notes.md
            echo "" >> release_notes.md
            echo -e "$fixes" >> release_notes.md
            echo "" >> release_notes.md
          fi
          if [ -n "$others" ]; then
            echo "## 优化与变更" >> release_notes.md
            echo "" >> release_notes.md
            echo -e "$others" >> release_notes.md
            echo "" >> release_notes.md
          fi

          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Polaris ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.release_body }}
          releaseDraft: true
          prerelease: false
