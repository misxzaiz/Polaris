name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: '26.1.10909125'
  ANDROID_API: 35
  RUST_ANDROID_TARGETS: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Setup: pnpm ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ---- Setup: Node.js ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ---- Setup: Rust ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_ANDROID_TARGETS }}

      # ---- Setup: JDK ----
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---- Setup: Android SDK & NDK ----
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools build-tools;35.0.0 platforms;android-${{ env.ANDROID_API }} ndk;${{ env.NDK_VERSION }}

      # ---- Fix NDK version (pre-installed NDK 29 may conflict) ----
      - name: Set NDK version
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "Using NDK: $ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          ls -la "$ANDROID_HOME/ndk/"

      # ---- Build: Frontend ----
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      # ---- Sync to polaris-mobile ----
      - name: Sync frontend to polaris-mobile
        run: |
          rm -rf polaris-mobile/dist
          cp -r dist polaris-mobile/dist

      # ---- Install polaris-mobile deps ----
      - name: Install polaris-mobile dependencies
        working-directory: polaris-mobile
        run: npm install --legacy-peer-deps

      # ---- Build: APK ----
      # 直接从 polaris-mobile/ 根目录用 Tauri CLI 构建,
      # CLI 内部处理: Rust 编译(--target 约束) -> 前端打包 -> Gradle -> APK
      # 绕开 buildSrc/BuildTask.kt 的 android-studio-script WebSocket 依赖
      - name: Build Android APK
        working-directory: polaris-mobile
        run: npx tauri android build --apk -t aarch64 -vv

      # ---- Rename APK ----
      - name: Rename APK with version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          APK_PATH=$(find polaris-mobile/src-tauri/gen/android/app/build/outputs/apk -name 'app-*-release.apk' -not -name '*universal*' -not -name '*signed*' -not -name '*univer*' | sort -V | tail -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            find polaris-mobile/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "release-artifacts/polaris-mobile-${VERSION}.apk"

      # ---- Verify APK ----
      - name: Verify APK contents
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APK: polaris-mobile-${VERSION}.apk"
          ls -lh "release-artifacts/polaris-mobile-${VERSION}.apk"
          unzip -l "release-artifacts/polaris-mobile-${VERSION}.apk" | grep -E "(index\.html|assets/main-|\.so)"

      # ---- Upload to Release ----
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/polaris-mobile-*.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}