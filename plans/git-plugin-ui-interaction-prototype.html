<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polaris Git 插件 · UI 交互评审原型</title>
<style>
:root {
  color-scheme: dark;
  --c-bg-base: 12 15 20;
  --c-bg-subtle: 18 23 31;
  --c-bg-elevated: 27 34 45;
  --c-bg-hover: 32 40 52;
  --c-bg-active: 38 48 63;
  --c-border: 43 52 66;
  --c-text-primary: 229 234 242;
  --c-text-secondary: 157 170 187;
  --c-text-tertiary: 105 120 140;
  --c-primary: 108 156 255;
  --c-primary-hover: 137 176 255;
  --c-success: 99 199 149;
  --c-danger: 242 125 136;
  --c-warning: 217 173 99;
  --c-info: 121 180 232;
  --shadow: 0 18px 50px rgb(0 0 0 / .38);
}
:root[data-theme="light"] {
  color-scheme: light;
  --c-bg-base: 246 248 251;
  --c-bg-subtle: 255 255 255;
  --c-bg-elevated: 255 255 255;
  --c-bg-hover: 235 239 245;
  --c-bg-active: 225 233 246;
  --c-border: 214 221 231;
  --c-text-primary: 30 39 52;
  --c-text-secondary: 84 98 116;
  --c-text-tertiary: 122 135 151;
  --c-primary: 55 110 210;
  --c-primary-hover: 42 91 181;
  --c-success: 34 139 91;
  --c-danger: 196 66 79;
  --c-warning: 157 105 28;
  --c-info: 45 117 175;
  --shadow: 0 18px 50px rgb(34 48 68 / .18);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body {
  overflow: hidden;
  background: rgb(var(--c-bg-base));
  color: rgb(var(--c-text-primary));
  font: 13px/20px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}
button, input, textarea, select { font: inherit; }
button { color: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid rgb(var(--c-primary));
  outline-offset: 2px;
}
button:disabled { opacity: .45; cursor: not-allowed !important; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgb(var(--c-border)); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
.svg-icon { width: 16px; height: 16px; flex: none; display: block; }
.prototype-bar {
  height: 58px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 16px;
  border-bottom: 1px solid rgb(var(--c-border));
  background: rgb(var(--c-bg-subtle));
  flex: none;
}
.prototype-title { display: flex; align-items: center; gap: 10px; min-width: 255px; }
.prototype-mark {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: rgb(var(--c-primary) / .14); color: rgb(var(--c-primary));
}
.prototype-title strong { display: block; font-size: 13px; line-height: 17px; }
.prototype-title small { display: block; color: rgb(var(--c-text-tertiary)); font-size: 11px; line-height: 14px; }
.prototype-controls { display: flex; align-items: center; gap: 8px; flex: 1; flex-wrap: wrap; }
.control-group {
  display: inline-flex; align-items: center; gap: 2px; padding: 2px;
  border: 1px solid rgb(var(--c-border)); border-radius: 7px; background: rgb(var(--c-bg-base));
}
.control-group button {
  min-height: 26px; padding: 2px 8px; border: 0; border-radius: 5px; cursor: pointer;
  background: transparent; color: rgb(var(--c-text-secondary)); font-size: 11px;
}
.control-group button:hover { background: rgb(var(--c-bg-hover)); color: rgb(var(--c-text-primary)); }
.control-group button.active { background: rgb(var(--c-bg-active)); color: rgb(var(--c-primary)); }
.prototype-select {
  height: 32px; padding: 0 28px 0 9px; border: 1px solid rgb(var(--c-border)); border-radius: 7px;
  background: rgb(var(--c-bg-base)); color: rgb(var(--c-text-primary)); font-size: 12px;
}
.prototype-badge {
  padding: 3px 8px; border: 1px solid rgb(var(--c-warning) / .35); border-radius: 999px;
  color: rgb(var(--c-warning)); background: rgb(var(--c-warning) / .08); font-size: 11px; white-space: nowrap;
}
.prototype-wrap { height: calc(100% - 58px); padding: 16px; min-height: 0; }
.host-shell {
  height: 100%; min-height: 0; display: grid; grid-template-columns: 46px auto minmax(320px, 1fr);
  overflow: hidden; border: 1px solid rgb(var(--c-border)); border-radius: 12px;
  background: rgb(var(--c-bg-base)); box-shadow: var(--shadow);
}
.activity-bar {
  display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0;
  background: rgb(var(--c-bg-subtle)); border-right: 1px solid rgb(var(--c-border));
}
.activity-logo { width: 25px; height: 25px; border-radius: 7px; display: grid; place-items: center; color: rgb(var(--c-primary)); margin-bottom: 12px; }
.activity-item {
  width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 7px;
  color: rgb(var(--c-text-tertiary)); background: transparent; cursor: pointer; position: relative;
}
.activity-item:hover { background: rgb(var(--c-bg-hover)); color: rgb(var(--c-text-primary)); }
.activity-item.active { color: rgb(var(--c-primary)); background: rgb(var(--c-primary) / .1); }
.activity-item.active::before { content: ""; position: absolute; left: -6px; width: 2px; height: 20px; background: rgb(var(--c-primary)); border-radius: 2px; }
.activity-spacer { flex: 1; }
.git-panel {
  width: 360px; height: 100%; min-height: 0; display: flex; flex-direction: column;
  background: rgb(var(--c-bg-subtle)); border-right: 1px solid rgb(var(--c-border));
  container-type: inline-size; position: relative; transition: width .18s ease;
}
.panel-header {
  min-height: 46px; padding: 7px 9px 6px 12px; display: flex; align-items: center; gap: 7px;
  border-bottom: 1px solid rgb(var(--c-border)); flex: none;
}
.repo-button {
  display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; padding: 3px 4px;
  border: 0; background: transparent; border-radius: 5px; cursor: pointer; text-align: left;
}
.repo-button:hover { background: rgb(var(--c-bg-hover)); }
.repo-button .repo-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.repo-button .repo-path { color: rgb(var(--c-text-tertiary)); font-size: 10px; line-height: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; display: inline-grid; place-items: center;
  background: transparent; color: rgb(var(--c-text-secondary)); cursor: pointer; flex: none; position: relative;
}
.icon-btn:hover { background: rgb(var(--c-bg-hover)); color: rgb(var(--c-text-primary)); }
.icon-btn.small { width: 26px; height: 26px; }
.icon-btn.active { color: rgb(var(--c-primary)); background: rgb(var(--c-primary) / .1); }
.icon-btn.danger:hover { color: rgb(var(--c-danger)); background: rgb(var(--c-danger) / .1); }
.branch-pill {
  display: inline-flex; align-items: center; gap: 5px; max-width: 150px; min-width: 0;
  height: 26px; padding: 0 8px; border: 1px solid rgb(var(--c-border)); border-radius: 6px;
  background: rgb(var(--c-bg-base)); color: rgb(var(--c-text-secondary)); cursor: pointer; font-size: 11px;
}
.branch-pill:hover { border-color: rgb(var(--c-primary) / .6); color: rgb(var(--c-text-primary)); }
.branch-pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-tabs {
  display: flex; align-items: stretch; min-height: 38px; padding: 0 5px; flex: none;
  overflow-x: auto; border-bottom: 1px solid rgb(var(--c-border)); scrollbar-width: none;
}
.panel-tabs::-webkit-scrollbar { display: none; }
.panel-tab {
  min-width: 39px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 0 6px; border: 0; border-bottom: 2px solid transparent; background: transparent;
  color: rgb(var(--c-text-tertiary)); cursor: pointer; position: relative;
}
.panel-tab:hover { color: rgb(var(--c-text-primary)); background: rgb(var(--c-bg-hover)); }
.panel-tab.active { color: rgb(var(--c-primary)); border-bottom-color: rgb(var(--c-primary)); background: rgb(var(--c-primary) / .05); }
.tab-count {
  min-width: 15px; height: 15px; padding: 0 4px; display: inline-grid; place-items: center;
  border-radius: 8px; background: rgb(var(--c-primary) / .14); color: rgb(var(--c-primary)); font-size: 9px;
}
.panel-status {
  flex: none; min-height: 34px; display: flex; align-items: center; gap: 6px; padding: 5px 11px;
  border-bottom: 1px solid rgb(var(--c-border)); color: rgb(var(--c-text-secondary)); font-size: 11px;
}
.panel-status .status-spacer { flex: 1; }
.sync-action { border: 0; background: transparent; color: rgb(var(--c-text-secondary)); cursor: pointer; display: flex; align-items: center; gap: 3px; padding: 2px 4px; border-radius: 4px; }
.sync-action:hover { color: rgb(var(--c-primary)); background: rgb(var(--c-primary) / .08); }
.conflict-banner, .error-banner, .info-banner {
  flex: none; margin: 8px 9px 0; padding: 8px 9px; border-radius: 7px; display: flex; align-items: flex-start; gap: 8px;
  font-size: 11px; line-height: 16px;
}
.conflict-banner { color: rgb(var(--c-danger)); background: rgb(var(--c-danger) / .08); border: 1px solid rgb(var(--c-danger) / .25); }
.error-banner { color: rgb(var(--c-danger)); background: rgb(var(--c-danger) / .07); border: 1px solid rgb(var(--c-danger) / .22); }
.info-banner { color: rgb(var(--c-info)); background: rgb(var(--c-info) / .07); border: 1px solid rgb(var(--c-info) / .2); }
.banner-copy { flex: 1; min-width: 0; }
.banner-copy strong { display: block; font-size: 12px; margin-bottom: 1px; }
.text-button { border: 0; padding: 0; background: transparent; color: rgb(var(--c-primary)); cursor: pointer; white-space: nowrap; font-size: 11px; }
.text-button:hover { text-decoration: underline; }
.selection-bar {
  flex: none; display: flex; align-items: center; gap: 5px; padding: 5px 9px;
  border-bottom: 1px solid rgb(var(--c-primary) / .25); background: rgb(var(--c-primary) / .06); font-size: 11px;
}
.selection-bar span { flex: 1; color: rgb(var(--c-text-secondary)); }
.panel-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.change-group { padding: 4px 0 3px; }
.group-header {
  height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  color: rgb(var(--c-text-secondary)); font-size: 11px; cursor: pointer; user-select: none;
}
.group-header:hover { background: rgb(var(--c-bg-hover) / .55); }
.group-header strong { color: rgb(var(--c-text-primary)); font-weight: 500; }
.group-header .group-count { color: rgb(var(--c-text-tertiary)); }
.group-header .group-actions { margin-left: auto; display: flex; gap: 2px; }
.file-row {
  min-height: 32px; display: flex; align-items: center; gap: 5px; padding: 1px 7px 1px 10px;
  color: rgb(var(--c-text-secondary)); position: relative;
}
.file-row:hover, .file-row:focus-within { background: rgb(var(--c-bg-hover) / .72); color: rgb(var(--c-text-primary)); }
.file-row.selected { background: rgb(var(--c-primary) / .07); }
.file-check { width: 14px; height: 14px; margin: 0; accent-color: rgb(var(--c-primary)); flex: none; cursor: pointer; }
.file-main {
  flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 5px; padding: 5px 0;
  border: 0; background: transparent; color: inherit; cursor: pointer; text-align: left;
}
.file-name { font-size: 12px; color: rgb(var(--c-text-primary)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-dir { font-size: 10px; color: rgb(var(--c-text-tertiary)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; direction: rtl; text-align: left; }
.file-status { width: 17px; text-align: center; font: 600 10px/16px Consolas, monospace; flex: none; }
.status-m { color: rgb(var(--c-warning)); }
.status-a { color: rgb(var(--c-success)); }
.status-d, .status-u { color: rgb(var(--c-danger)); }
.status-r { color: rgb(var(--c-info)); }
.file-actions { display: flex; align-items: center; gap: 1px; flex: none; opacity: 0; }
.file-row:hover .file-actions, .file-row:focus-within .file-actions { opacity: 1; }
.commit-dock {
  flex: none; padding: 8px 10px 9px; border-top: 1px solid rgb(var(--c-border));
  background: rgb(var(--c-bg-subtle)); position: relative;
}
.ai-suggestion {
  margin-bottom: 7px; padding: 7px 8px; border: 1px solid rgb(var(--c-primary) / .28); border-radius: 7px;
  background: rgb(var(--c-primary) / .055); animation: slide-in .16s ease;
}
.ai-title { display: flex; align-items: center; gap: 5px; color: rgb(var(--c-primary)); font-size: 11px; margin-bottom: 3px; }
.ai-title .ai-state { margin-left: auto; color: rgb(var(--c-text-tertiary)); font-size: 10px; }
.ai-text { color: rgb(var(--c-text-secondary)); font-size: 11px; line-height: 16px; max-height: 32px; overflow: hidden; }
.ai-actions { display: flex; align-items: center; gap: 9px; margin-top: 5px; }
.commit-input-wrap { position: relative; }
.commit-input {
  width: 100%; min-height: 56px; max-height: 110px; resize: vertical; padding: 7px 35px 7px 9px;
  border: 1px solid rgb(var(--c-border)); border-radius: 7px; background: rgb(var(--c-bg-base));
  color: rgb(var(--c-text-primary)); font-size: 12px; line-height: 17px; outline: none;
}
.commit-input:focus { border-color: rgb(var(--c-primary)); box-shadow: 0 0 0 2px rgb(var(--c-primary) / .12); }
.commit-input::placeholder { color: rgb(var(--c-text-tertiary)); }
.ai-trigger { position: absolute; right: 4px; top: 4px; color: rgb(var(--c-primary)); }
.commit-footer { min-height: 29px; display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.commit-scope { flex: 1; min-width: 0; color: rgb(var(--c-text-tertiary)); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amend-label { display: flex; align-items: center; gap: 4px; color: rgb(var(--c-text-tertiary)); font-size: 10px; white-space: nowrap; cursor: pointer; }
.amend-label input { width: 13px; height: 13px; margin: 0; accent-color: rgb(var(--c-primary)); }
.primary-btn, .secondary-btn, .danger-btn {
  min-height: 29px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; white-space: nowrap;
}
.primary-btn { border: 1px solid rgb(var(--c-primary)); background: rgb(var(--c-primary)); color: rgb(var(--c-bg-subtle)); font-weight: 600; }
.primary-btn:hover { background: rgb(var(--c-primary-hover)); border-color: rgb(var(--c-primary-hover)); }
.secondary-btn { border: 1px solid rgb(var(--c-border)); background: rgb(var(--c-bg-base)); color: rgb(var(--c-text-secondary)); }
.secondary-btn:hover { background: rgb(var(--c-bg-hover)); color: rgb(var(--c-text-primary)); }
.danger-btn { border: 1px solid rgb(var(--c-danger)); background: rgb(var(--c-danger)); color: rgb(var(--c-bg-subtle)); font-weight: 600; }
.diff-head { flex: none; padding: 7px 9px; border-bottom: 1px solid rgb(var(--c-border)); }
.diff-head-row { display: flex; align-items: center; gap: 4px; }
.diff-path { flex: 1; min-width: 0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.diff-stats { display: flex; gap: 7px; padding: 5px 28px 0; font-size: 10px; color: rgb(var(--c-text-tertiary)); }
.diff-stats .add { color: rgb(var(--c-success)); }
.diff-stats .del { color: rgb(var(--c-danger)); }
.diff-code { flex: 1; min-height: 0; overflow: auto; padding: 8px 0; font: 11px/19px Consolas, "Courier New", monospace; background: rgb(var(--c-bg-base)); }
.diff-line { min-width: 480px; display: grid; grid-template-columns: 34px 34px 18px 1fr; padding-right: 10px; white-space: pre; }
.diff-line .ln { color: rgb(var(--c-text-tertiary)); text-align: right; padding-right: 8px; user-select: none; }
.diff-line.add { background: rgb(var(--c-success) / .08); color: rgb(var(--c-success)); }
.diff-line.del { background: rgb(var(--c-danger) / .07); color: rgb(var(--c-danger)); }
.diff-line.hunk { background: rgb(var(--c-info) / .07); color: rgb(var(--c-info)); margin: 4px 0; }
.diff-line.context { color: rgb(var(--c-text-secondary)); }
.diff-footer { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-top: 1px solid rgb(var(--c-border)); }
.diff-footer .spacer { flex: 1; }
.search-row { display: flex; gap: 5px; padding: 8px 9px; border-bottom: 1px solid rgb(var(--c-border)); }
.search-wrap { flex: 1; min-width: 0; position: relative; }
.search-wrap .svg-icon { position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; color: rgb(var(--c-text-tertiary)); }
.search-input { width: 100%; height: 29px; padding: 4px 8px 4px 27px; border: 1px solid rgb(var(--c-border)); border-radius: 6px; background: rgb(var(--c-bg-base)); color: rgb(var(--c-text-primary)); font-size: 11px; outline: none; }
.search-input:focus { border-color: rgb(var(--c-primary)); }
.commit-row { display: flex; gap: 6px; min-height: 58px; padding: 7px 9px; cursor: pointer; border-left: 2px solid transparent; }
.commit-row:hover { background: rgb(var(--c-bg-hover) / .65); }
.commit-row.active { background: rgb(var(--c-primary) / .07); border-left-color: rgb(var(--c-primary)); }
.lane { width: 14px; flex: none; position: relative; display: flex; justify-content: center; }
.lane::before { content: ""; position: absolute; top: -7px; bottom: -7px; width: 1px; background: rgb(var(--c-primary) / .45); }
.lane-dot { width: 8px; height: 8px; margin-top: 7px; border: 2px solid rgb(var(--c-primary)); border-radius: 50%; background: rgb(var(--c-bg-subtle)); z-index: 1; }
.commit-info { flex: 1; min-width: 0; }
.commit-subject { color: rgb(var(--c-text-primary)); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.commit-meta { color: rgb(var(--c-text-tertiary)); font-size: 10px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref-chip { display: inline-block; padding: 0 5px; margin-right: 4px; border-radius: 4px; background: rgb(var(--c-primary) / .1); color: rgb(var(--c-primary)); font-size: 9px; line-height: 15px; }
.section-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px; color: rgb(var(--c-text-secondary)); font-size: 11px; }
.section-head strong { flex: 1; color: rgb(var(--c-text-primary)); font-weight: 600; }
.list-card { margin: 4px 8px; border: 1px solid rgb(var(--c-border)); border-radius: 7px; background: rgb(var(--c-bg-base)); overflow: hidden; }
.list-card-row { display: flex; align-items: center; gap: 7px; min-height: 40px; padding: 6px 8px; border-bottom: 1px solid rgb(var(--c-border) / .7); }
.list-card-row:last-child { border-bottom: 0; }
.list-card-row:hover { background: rgb(var(--c-bg-hover) / .6); }
.list-card-copy { flex: 1; min-width: 0; }
.list-card-title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-card-sub { color: rgb(var(--c-text-tertiary)); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.current-badge { padding: 1px 5px; border-radius: 4px; color: rgb(var(--c-success)); background: rgb(var(--c-success) / .1); font-size: 9px; }
.empty-state, .loading-state { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; color: rgb(var(--c-text-secondary)); }
.empty-state .empty-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: rgb(var(--c-success) / .08); color: rgb(var(--c-success)); margin-bottom: 10px; }
.empty-state strong { color: rgb(var(--c-text-primary)); margin-bottom: 3px; }
.empty-state p { margin: 0 0 12px; color: rgb(var(--c-text-tertiary)); font-size: 11px; }
.skeleton { width: 100%; height: 30px; border-radius: 6px; margin: 5px 0; background: linear-gradient(90deg, rgb(var(--c-bg-hover)), rgb(var(--c-bg-active)), rgb(var(--c-bg-hover))); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
.gitignore-editor { width: calc(100% - 18px); min-height: 240px; margin: 8px 9px; padding: 9px; resize: vertical; border: 1px solid rgb(var(--c-border)); border-radius: 7px; background: rgb(var(--c-bg-base)); color: rgb(var(--c-text-primary)); font: 11px/18px Consolas, monospace; }
.popover {
  position: absolute; top: 43px; right: 7px; z-index: 20; min-width: 190px; padding: 5px;
  border: 1px solid rgb(var(--c-border)); border-radius: 8px; background: rgb(var(--c-bg-elevated)); box-shadow: var(--shadow);
}
.menu-item { width: 100%; min-height: 31px; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border: 0; border-radius: 5px; background: transparent; color: rgb(var(--c-text-secondary)); cursor: pointer; text-align: left; font-size: 11px; }
.menu-item:hover { background: rgb(var(--c-bg-hover)); color: rgb(var(--c-text-primary)); }
.menu-item.danger { color: rgb(var(--c-danger)); }
.menu-separator { height: 1px; background: rgb(var(--c-border)); margin: 4px; }
.center-stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: rgb(var(--c-bg-base)); }
.center-tabs { height: 40px; flex: none; display: flex; align-items: center; border-bottom: 1px solid rgb(var(--c-border)); background: rgb(var(--c-bg-subtle)); }
.center-tab { height: 100%; display: flex; align-items: center; gap: 7px; padding: 0 13px; border: 0; border-right: 1px solid rgb(var(--c-border)); border-top: 2px solid rgb(var(--c-primary)); background: rgb(var(--c-bg-base)); color: rgb(var(--c-text-primary)); font-size: 11px; }
.center-toolbar { margin-left: auto; display: flex; align-items: center; gap: 4px; padding: 0 8px; }

  const batch = state.dialog.type === 'batch';
  const count = batch ? state.selected.size : 1;
  root.innerHTML = '<div class="dialog-mask" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><span class="danger-icon">' + icon('alert') + '</span><strong id="dialog-title">丢弃 ' + count + ' 个文件的变更？</strong></div>' +
    '<div class="dialog-body"><p>此操作会覆盖工作区内容，提交框草稿不会受影响。</p><div class="impact-box"><div>影响范围：' + count + ' 个文件</div><div>' + (batch ? '包括已选中的暂存与未暂存变更' : esc(state.dialog.path)) + '</div><div>未跟踪文件将单独检查可恢复性</div></div><div class="safety-note">' + icon('shield') + '执行前创建快照；成功后可从通知中撤销。</div></div>' +
    '<div class="dialog-actions"><button class="secondary-btn" data-action="dialog-cancel">取消</button><button class="danger-btn" data-action="dialog-confirm">丢弃 ' + count + ' 个文件</button></div></div></div>';
  const cancel = root.querySelector('[data-action="dialog-cancel"]');
  if (cancel) cancel.focus();
}
function renderControls() {
  document.querySelectorAll('[data-action="width"]').forEach(b => b.classList.toggle('active', Number(b.dataset.value) === state.width));
  document.getElementById('scenario').value = state.scenario;
  document.getElementById('theme-button').textContent = state.theme === 'dark' ? '切换浅色' : '切换深色';
  document.documentElement.dataset.theme = state.theme;
}
function renderAll() { renderControls(); renderPanel(); renderCenter(); renderDialog(); }

function resetScenario(name) {
  clearTimeout(aiTimer);
  clearTimeout(taskTimer);
  state.scenario = name;
  state.files = structuredClone(BASE_FILES);
  if (name === 'conflict') state.files.conflicted = [{ path: 'src/components/ChangesList.tsx', status: 'U', area: 'conflicted', additions: 8, deletions: 8 }];
  if (name === 'empty') state.files = { staged: [], unstaged: [], untracked: [], conflicted: [] };
  state.selected.clear();
  state.ai = 'idle';
  state.panelDiff = null;
  state.center = 'editor';
  state.mergeResolved = false;
  state.task = null;
  state.menu = false;
}
function generateAi() {
  clearTimeout(aiTimer);
  state.ai = 'loading';
  state.center = 'chat';
  state.menu = false;
  renderAll();
  const revision = ++state.aiRevision;
  aiTimer = setTimeout(() => {
    if (state.ai !== 'loading' || revision !== state.aiRevision) return;
    state.aiText = state.selected.size > 1 ? 'refactor: 收拢 Git 插件数据通道并补充工作区测试' : 'feat: 增加 Git 插件宿主网关并完善提交交互';
    state.ai = 'ready';
    renderAll();
    toast('AI 建议已生成，采用后仍需人工提交');
  }, 900);
}
function stageFile(path, targetArea) {
  const file = removeFile(path);
  if (!file) return;
  const area = targetArea || (file.area === 'staged' ? 'unstaged' : 'staged');
  addFile(file, area);
  state.panelDiff = null;
  renderAll();
  toast(area === 'staged' ? '已暂存 ' + splitPath(path).name : '已取消暂存 ' + splitPath(path).name);
}
function openDiff(path, central = false) {
  state.currentFile = path;
  state.menu = false;
  if (central || state.width < 280) {
    state.center = 'diff';
    state.panelDiff = null;
  } else {
    state.panelDiff = { path };
  }
  renderAll();
}
function commit() {
  const canCommit = (state.message.trim() || state.amend) && (state.selected.size || state.files.staged.length);
  if (!canCommit || state.busy) return;
  state.busy = true;
  renderAll();
  setTimeout(() => {
    const paths = state.selected.size ? Array.from(state.selected) : state.files.staged.map(f => f.path);
    paths.forEach(removeFile);
    state.selected.clear();
    state.message = '';
    state.amend = false;
    state.busy = false;
    state.ai = 'idle';
    renderAll();
    toast('原型：提交完成 · ' + paths.length + ' 个文件（未执行真实 Git）');
  }, 700);
}

document.addEventListener('click', event => {
  const el = event.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const path = el.dataset.path;
  if (!['select-file'].includes(action)) event.preventDefault();
  switch (action) {
    case 'width': state.width = Number(el.dataset.value); state.panelDiff = null; renderAll(); break;
    case 'theme': state.theme = state.theme === 'dark' ? 'light' : 'dark'; renderControls(); break;
    case 'tab': state.tab = el.dataset.value; state.panelDiff = null; state.menu = false; renderAll(); break;
    case 'refresh':
      state.busy = true; state.menu = false; renderAll();
      setTimeout(() => { state.busy = false; if (state.scenario === 'error') state.scenario = 'normal'; renderAll(); toast('仓库状态已刷新（模拟）'); }, 600);
      break;
    case 'workspace-info': toast('工作区由宿主自动绑定：Polaris / main'); break;
    case 'branch-menu': state.tab = 'branch'; state.menu = false; renderAll(); break;
    case 'more-menu': state.menu = !state.menu; renderPanel(); break;
    case 'collapse': {
      const area = el.dataset.value;
      if (state.collapsed.has(area)) state.collapsed.delete(area); else state.collapsed.add(area);
      renderPanel(); break;
    }
    case 'select-file': {
      if (el.checked) state.selected.add(path); else state.selected.delete(path);
      renderPanel(); break;
    }
    case 'clear-selection': state.selected.clear(); renderPanel(); break;
    case 'open-diff': openDiff(path); break;
    case 'central-diff': openDiff(path, true); break;
    case 'central-current': openDiff(state.currentFile, true); break;
    case 'close-diff': state.panelDiff = null; renderPanel(); break;
    case 'open-file': state.center = 'editor'; state.panelDiff = null; renderAll(); break;
    case 'stage': case 'unstage': stageFile(path); break;
    case 'stage-group': {
      event.stopPropagation();
      const area = el.dataset.value;
      const files = [...state.files[area]];
      files.forEach(f => stageFile(f.path, area === 'staged' ? 'unstaged' : 'staged'));
      break;
    }
    case 'batch-stage': {
      const paths = Array.from(state.selected);
      paths.forEach(p => { const f = findFile(p); if (f && f.area !== 'staged') stageFile(p, 'staged'); });
      renderAll(); break;
    }
    case 'discard': state.dialog = { type: 'single', path }; renderDialog(); break;
    case 'batch-discard': state.dialog = { type: 'batch' }; renderDialog(); break;
    case 'dialog-cancel': state.dialog = null; renderDialog(); break;
    case 'dialog-confirm': {
      const paths = state.dialog.type === 'batch' ? Array.from(state.selected) : [state.dialog.path];
      state.lastDiscarded = paths.map(removeFile).filter(Boolean);
      paths.forEach(p => state.selected.delete(p));
      state.dialog = null;
      renderAll();
      toast('已丢弃变更；快照已创建（模拟）', { id: 'undo-discard', label: '撤销' });
      break;
    }
    case 'undo-discard': if (state.lastDiscarded) { state.lastDiscarded.forEach(f => addFile(f, f.area)); state.lastDiscarded = null; renderAll(); toast('已从快照恢复（模拟）'); } break;
    case 'ai-generate': generateAi(); break;
    case 'ai-adopt':
      if (state.ai !== 'ready') break;
      state.message = state.aiText; state.tab = 'changes'; state.panelDiff = null; renderAll();
      toast('建议已写入提交框，尚未提交');
      setTimeout(() => { const input = document.getElementById('commit-message'); if (input) input.focus(); }, 0);
      break;
    case 'ai-open': state.center = 'chat'; renderCenter(); break;
    case 'ai-followup': toast('追问将保留在同一独立 kind 会话（原型演示）'); break;
    case 'commit': commit(); break;
    case 'open-merge': state.center = 'merge'; state.mergeResolved = false; renderCenter(); break;
    case 'merge-choice': state.mergeResolved = true; renderCenter(); toast(el.dataset.value === 'ai' ? 'AI 草稿已放入结果，需人工确认' : '选择已写入结果窗格'); break;
    case 'merge-resolve': {
      if (!state.mergeResolved) break;
      const conflict = state.files.conflicted[0];
      if (conflict) { removeFile(conflict.path); addFile({ ...conflict, status: 'M' }, 'staged'); }
      state.center = 'diff'; renderAll(); toast('冲突已解决并进入已暂存（模拟）'); break;
    }
    case 'commit-detail': state.activeCommit = el.dataset.value || state.activeCommit; state.center = 'diff'; renderAll(); break;
    case 'workbench': state.center = 'workbench'; state.menu = false; renderAll(); break;
    case 'center-editor': state.center = 'editor'; renderCenter(); break;
    case 'center-chat': if (state.ai === 'idle') generateAi(); else { state.center = 'chat'; renderCenter(); } break;
    case 'push':
      clearTimeout(taskTimer); state.tab = 'remote'; state.task = 'running'; renderAll();
      taskTimer = setTimeout(() => { state.task = 'done'; renderAll(); toast('Push 已完成（模拟）'); }, 1200); break;
    case 'pull': case 'fetch': toast((action === 'pull' ? 'Pull' : 'Fetch') + ' 长任务已创建，进度由宿主事件驱动（模拟）'); break;
    case 'new-branch': case 'new-tag': case 'add-remote': case 'stash-save': case 'ignore-template': toast('已打开对应创建/编辑流程（原型占位）'); break;
    case 'checkout': toast('切换前将检查本地改动风险（模拟）'); break;
    case 'stash-apply': toast('Stash 已应用，记录保留（模拟）'); break;
    case 'stash-pop': toast('Stash 成功后移除记录（模拟）'); break;
    case 'ignore-save': toast('.gitignore 已保存（模拟）'); break;
    case 'copy': toast('远程地址已复制（模拟）'); break;
    case 'load-more': toast('下一页提交将追加到列表，不替换已有数据'); break;
    case 'history-filter': toast('筛选条件：分支 / 作者 / 路径 / 日期'); break;
    case 'operations': case 'undo-list': case 'shortcuts': state.menu = false; renderPanel(); toast('对应面板入口已触发（原型演示）'); break;
  }
});
document.getElementById('scenario').addEventListener('change', e => { resetScenario(e.target.value); renderAll(); });
document.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && event.target.id === 'commit-message') {
    event.preventDefault(); commit(); return;
  }
  if (event.key === 'F5' && !event.target.closest('input, textarea, [role="dialog"]')) {
    event.preventDefault(); document.querySelector('[data-action="refresh"]')?.click(); return;
  }
  if (event.key === 'Escape') {
    if (state.dialog) { state.dialog = null; renderDialog(); }
    else if (state.menu) { state.menu = false; renderPanel(); }
    else if (state.panelDiff) { state.panelDiff = null; renderPanel(); }
    else if (state.selected.size) { state.selected.clear(); renderPanel(); }
  }
});
document.addEventListener('click', event => {
  if (state.menu && !event.target.closest('.popover') && !event.target.closest('[data-action="more-menu"]')) {
    state.menu = false; renderPanel();
  }
});

document.getElementById('brand-icon').innerHTML = icon('git');
document.getElementById('activity-logo').innerHTML = icon('git');
document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
renderAll();
</script>
</body>
</html>
