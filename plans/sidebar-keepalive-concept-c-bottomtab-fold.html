<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案C · 底部 Tab + 快速折叠</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0A0C16; --elev:#0C1022; --surface:#121630; --surface2:#171C3C;
    --border:rgba(140,150,200,.14); --border2:rgba(140,150,200,.22);
    --primary:#00D9FF; --primary-dim:rgba(0,217,255,.12);
    --text:#E8EAF4; --text2:#A9B2CC; --text3:#7E8AB5; --muted:#5C6A92;
    --danger:#FF6B6B; --ok:#3DDC97;
  }
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;font-size:13px;overflow:hidden;}
  #app{display:flex;height:100vh;}
  #menubar{position:fixed;top:0;left:0;right:0;height:38px;z-index:20;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--elev);border-bottom:1px solid var(--border);}
  #menubar .logo{width:22px;height:22px;border-radius:50%;border:1px solid var(--border2);background:conic-gradient(from 0deg,var(--primary),transparent 60%,var(--primary) 75%);opacity:.9;}
  #menubar .brand{font-size:12.5px;font-weight:600;letter-spacing:.2px;}
  #menubar .work{font-size:11px;color:var(--text3);padding:3px 8px;border:1px solid var(--border);border-radius:6px;}
  #menubar #top-fold{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);}
  #menubar #top-fold button{border:1px solid var(--border2);background:var(--surface);color:var(--text2);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:11px;}
  #menubar #top-fold button:hover{color:var(--primary);border-color:var(--primary);}
  /* ===== 侧栏 ===== */
  #side{margin-top:38px;display:flex;flex-direction:column;background:var(--elev);border-right:1px solid var(--border);overflow:hidden;transition:width .18s cubic-bezier(.32,.72,0,1),min-width .18s;}
  #side.open{width:318px;min-width:318px;}
  #side.closed{width:0;min-width:0;border-right:none;}
  /* 底部 tab strip（最关键差异：在底部） */
  #tabstrip{
    margin-top:auto; display:flex; align-items:stretch; height:40px; flex-shrink:0;
    border-top:1px solid var(--border); background:var(--elev);
  }
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text3);font-size:11.5px;border-right:1px solid var(--border);position:relative;transition:.12s;}
  .tab:last-child{border-right:none;}
  .tab i{font-style:normal;font-size:15px;}
  .tab .tt{display:none;}
  .tab.active{color:var(--primary);background:var(--surface2);}
  .tab.active::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--primary);}
  .tab .nd{width:6px;height:6px;border-radius:50%;background:var(--danger);}
  .tab .close{margin-left:2px;font-size:10px;color:var(--muted);opacity:0;transition:.1s;width:12px;height:12px;border-radius:3px;display:flex;align-items:center;justify-content:center;}
  .tab:hover .close{opacity:1;}
  .tab .close:hover{background:var(--surface);color:var(--text);}
  /* 面板 */
  #panels{flex:1;min-height:0;display:flex;}
  .panel{width:100%;height:100%;display:flex;flex-direction:column;min-height:0;}
  .panel.hidden{display:none;}
  .panel-scroll{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 28px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}
  .panel-scroll::-webkit-scrollbar{width:6px}.panel-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  .head{display:flex;align-items:center;padding:6px 10px 2px;font-size:11px;color:var(--muted);}
  /* 文件树 */
  .tree-row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:5px;cursor:pointer;color:var(--text2);font-size:12.5px;}
  .tree-row:hover{background:var(--surface);}
  .tree-row .caret{width:12px;color:var(--text3);display:inline-block;font-size:9px;transition:transform .12s;}
  .tree-row .caret.open{transform:rotate(90deg);}
  .tree-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spacer{display:inline-block;width:12px;}
  /* 变更 */
  .gh{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:12px;}
  .gh .seg{flex:1;} .gh .branch{color:var(--primary);font-family:Consolas,monospace;}
  .file-line{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text2);font-size:12.5px;cursor:pointer;}
  .file-line:hover{background:var(--surface);}
  .file-line .p{flex:1;font-family:"Cascadia Code",Consolas,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-line .st{margin-right:4px;color:var(--muted);}
  .check{width:14px;height:14px;border-radius:3px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:.1s;}
  .file-line.checked .check{background:var(--primary);color:#06121a;border-color:var(--primary);}
  /* 终端 */
  .term{background:#06080f;font-family:"Cascadia Code",Consolas,monospace;font-size:12px;color:#C8D3E8;padding:10px 12px;line-height:1.7;flex:1;}
  .term .p{color:var(--primary);}.term .dim{color:var(--muted);}.term .ok{color:var(--ok);}
  /* 右侧 */
  #work{flex:1;margin-top:38px;display:flex;flex-direction:column;background:var(--bg);}
  #work .tabs{display:flex;align-items:center;height:36px;border-bottom:1px solid var(--border);padding:0 8px;gap:4px;}
  #work .ftab{padding:2px 16px;border-radius:6px 6px 0 0;color:var(--text3);font-size:12px;border:1px solid transparent;}
  #work .canvas{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;}
  #canvas-card{border:1px dashed var(--border2);border-radius:12px;padding:22px 40px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  #notes{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(12,16,34,.92);border:1px solid var(--border2);border-radius:999px;padding:6px 16px;font-size:11px;color:var(--text3);display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  #notes b{color:var(--primary);font-weight:600;}
</style>
</head>
<body>
<div id="app">
  <div id="menubar">
    <div class="logo"></div><span class="brand">Polaris</span>
    <span class="work">方案Ｃ · 底部 Tab + 一键折叠</span>
    <span style="flex:1"></span>
    <div id="top-fold"><span style="color:var(--muted)">一键折叠:</span><button id="fold-btn">◀ 折叠侧栏</button></div>
  </div>

  <div id="side" class="open">
    <div id="panels">
      <!-- 文件 -->
      <div class="panel" data-panel="files">
        <div class="head">资源管理器</div>
        <div class="panel-scroll" id="file-scroll"><div id="filetree"></div></div>
      </div>
      <!-- 变更 -->
      <div class="panel hidden" data-panel="changes">
        <div class="head">源代码管理</div>
        <div class="gh"><span class="seg">变更</span><span class="branch">main</span><span style="color:var(--muted)">2 文件</span></div>
        <div class="panel-scroll">
          <div class="file-line"><span class="check">✓</span><span class="p">src/App.tsx</span><span class="st">M</span></div>
          <div class="file-line"><span class="check">✓</span><span class="p">src/stores/viewStore.ts</span><span class="st">M</span></div>
          <div style="padding:6px 10px;color:var(--muted);font-size:11px;">已暂存区域 ▸</div>
        </div>
      </div>
      <!-- 终端 -->
      <div class="panel hidden" data-panel="terminal">
        <div class="head">终端</div>
        <div class="term"><span class="p">polaris</span>@<span class="dim">workspace</span><span class="p"> ~</span> <span>$</span> pnpm test:run<br>
          <span class="dim">[16:18:02]</span>  ✓ <span class="ok">14 passed</span> (ToolSwitcher.test.tsx)<br>
          <span class="p">polaris</span>@<span class="dim">workspace</span><span class="p"> ~</span> <span>$</span> <span class="term-caret">▊</span></div>
      </div>
    </div>

    <!-- 底部 tab strip -->
    <div id="tabstrip">
      <div class="tab active" data-t="files"><i>▤</i><span class="tt">文件</span></div>
      <div class="tab" data-t="changes"><i>⚑</i><span class="nd"></span><span class="tt">变更</span></div>
      <div class="tab" data-t="terminal"><i>▣</i><span class="tt">终端</span></div>
    </div>
  </div>

  <!-- 折叠后快速唤回 -->
  <div id="side2" style="margin-top:38px;display:none;flex-direction:column;align-items:center;padding-top:6px;gap:6px;background:var(--elev);border-right:1px solid var(--border);">
    <button data-r="files" style="border:none;background:transparent;color:var(--text3);font-size:16px;cursor:pointer;padding:4px;" title="展开到文件">▤</button>
    <span style="color:var(--muted);font-size:9px;">…</span>
  </div>

  <div id="work">
    <div class="tabs"><div class="ftab on">修改日志</div></div>
    <div class="canvas"><div id="canvas-card"><span style="font-size:16px;color:var(--text3)">📄</span><span class="ph">主工作区（原型示意，不属于侧栏方案）</span></div></div>
  </div>
</div>

<div id="notes"><span><b>保活 ✓</b> 切页/折叠 → 展开、勾选、滚动都在</span><span>「关闭」= 只剩图标tab，数据缓存不销毁</span></div>

<script>
  // 文件树（保活：展开状态存内存）
  const tree = [
    {d:'src', kids:[{d:'components', kids:[{d:'Layout', kids:[{f:'ToolSwitcher.tsx'},{f:'LeftPanel.tsx'},{f:'ActivityBar.tsx'}]},{f:'App.tsx'},{f:'main.tsx'}]}]},
    {d:'stores', kids:[{f:'viewStore.ts'},{f:'gitStore'}]},
    {d:'styles', kids:[{f:'index.css'}]},
    {f:'package.json'},{f:'vite.config.ts'}
  ];
  const expanded = new Set(['src','components','Layout']);
  function renderTree(nodes, deep){
    let html='';
    for(const n of nodes){
      if(n.d){ const open=expanded.has(n.d);
        html += `<div class="tree-row" data-dir="${n.d}" style="padding-left:${2+deep*16}px"><span class="caret ${open?'open':''}">▶</span><span style="color:#9FB4E8">▤</span><span class="name">${n.d}</span></div>`;
        if(open) html += renderTree(n.kids,deep+1);
      } else {
        html += `<div class="tree-row" style="padding-left:${2+deep*16+14}px"><span class="spacer"></span><span style="width:14px;text-align:center;color:var(--text3);font-size:10px">·</span><span class="name">${n.f}</span></div>`;
      }
    }
    return html;
  }
  function paintTree(){ document.getElementById('filetree').innerHTML=renderTree(tree,0);
    document.querySelectorAll('.tree-row[data-dir]').forEach(r=>{ r.onclick=()=>{const d=r.dataset.dir; if(expanded.has(d))expanded.delete(d);else expanded.add(d); paintTree(); }; }); }
  paintTree();

  // 底部 tab 切换（保活：只切 display）
  const tabs = document.querySelectorAll('#tabstrip .tab');
  const panels = document.querySelectorAll('.panel');
  panels.forEach(p=>p.classList.add('hidden'));
  document.querySelector('.panel[data-panel="files"]').classList.remove('hidden');
  tabs.forEach(tb=>{ tb.onclick=()=>{
    tabs.forEach(t=>t.classList.toggle('active', t===tb));
    panels.forEach(p=>p.classList.toggle('hidden', p.dataset.panel!==tb.dataset.t));
  }; });

  // 底部 tab 的 × = 关闭该面板（数据缓存，再点图标回来还在）
  tabs.forEach(tb=>{ tb.onclickDisplay = tb.onclick; });

  // 一键折叠 / 展开（顶部按钮 + 折叠后快速唤回）
  const side=document.getElementById('side'), side2=document.getElementById('side2');
  const foldBtn=document.getElementById('fold-btn');
  let closed=false;
  function setClosed(v){
    closed=v;
    side.classList.toggle('closed',v); side.classList.toggle('open',!v);
    side2.style.display = v ? 'flex' : 'none';
    side2.style.width = v?'26px':'0';
    foldBtn.textContent = v? '▶ 展开侧栏':'◀ 折叠侧栏';
  }
  setClosed(false);
  foldBtn.onclick=()=>{ setClosed(!closed); };
  side2.querySelector('button').onclick=()=>{ setClosed(false); };

  // 勾选保活
  document.querySelectorAll('.file-line').forEach(l=>{ l.onclick=()=>l.classList.toggle('checked'); });
</script>
</body>
</html>
