[package]
name = "polaris-pocket"
version = "1.0.0"
description = "Polaris Pocket — 独立 AI 多功能工具"
authors = ["Polaris"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "polaris_pocket_lib"
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = ["custom-protocol"] }
