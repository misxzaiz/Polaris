[build]
# 使用 mold 链接器加速 debug 构建（如果系统安装了 mold）
# runner = "mold"

# 使用 LLD 链接器（LLVM），比默认 MSVC 链接器更快
# 需要安装: rustup component add llvm-tools
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "link-arg=/STACK:8388608",
    "-C", "link-arg=/OPT:REF,ICF",
]

[profile.dev]
# 保留调试符号
debug = true
opt-level = 0
incremental = true
# 减少 dev 构建的 codegen units 以加快编译
codegen-units = 16

[profile.dev.package."*"]
# 依赖库使用较高优化级别，减少调试时的噪音
opt-level = 2
# 依赖库不生成调试信息（2026-11-07 构建性能治理）：
# 根因：target/debug/deps 实测 5.5G，大头是依赖 rlib 内嵌的行号调试信息
# （如 windows-sys 单份 rlib 126M，锁文件里 6 个大版本 × 13 个指纹家族共 20 份）。
# 依赖内部无需断点/单步，去 debug 显著缩 rlib 体积并提速依赖编译；
# 自身代码（polaris_lib）仍走 [profile.dev] 的 debug=1，断点调试不受影响。
debug = false
# 依赖库使用更多 codegen units 以加快编译
codegen-units = 16

[profile.release]
# Release 构建优化
opt-level = 3
lto = "thin"
# codegen-units: 1 最优但最慢，16 平衡速度与优化
# 开发时使用 16，发布前可改为 1 以获得最佳性能
codegen-units = 16
# 启用 panic=abort，减小二进制体积并提高性能
panic = "abort"
# 启用 strip，移除调试符号以减小体积
strip = true
# 增量编译
incremental = true

[profile.release.package."*"]
# 依赖库使用更多 codegen units 以加快编译
codegen-units = 16
