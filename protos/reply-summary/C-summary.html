<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 C · 摘要式（简介常显）</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="demo-C">

<div class="topbar">
  <h1>原型 C · 摘要式</h1>
  <span class="sub">一行卡片 · 三区默认各显 1 行简介 · 点击展开细节</span>
  <label class="switch"><input type="checkbox" onchange="themeSw(this.checked)">Light 主题</label>
</div>

<div class="note">
  <b>特点：</b>最轻量 —— 不依赖"先展开再找"；三区各自先给一行摘要（思考一句话 / 文件数 / 预览标题），
  需要细节再点开。适合快速扫读；信息密度最低。
</div>

<div class="chat-col">
  <div class="artifact-card" style="border-radius:10px">
    <div class="artifact-body" style="padding:10px 14px;font-size:13px;color:var(--text-secondary);line-height:1.7" data-assistant></div>
  </div>

  <!-- 补充卡片 C -->
  <div class="summary-card">
    <div class="card-head">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>
      <span style="font-size:12px;font-weight:500">回复摘要</span>
      <span class="meta" style="margin-left:auto;font-size:11px">点击各行展开细节</span>
    </div>
    <div class="card-body">
      <!-- 理解分析：一行摘要 -->
      <div class="mini-row" data-mini="think">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--purple-400);flex-shrink:0"><path d="M9 3a3 3 0 0 1 6 0M12 5a7 7 0 0 1 7 7v2a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-2a7 7 0 0 1 7-7Z"/><path d="M9 20a3 3 0 0 0 6 0"/></svg>
        <span style="font-weight:500;flex-shrink:0">理解分析</span>
        <span class="sum">考虑卡片形态与现有"运行过程已折叠"保持一致…</span>
        <span class="chip purple" style="flex-shrink:0">思考 1</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="hidden" data-mini-body="think"><div id="thinkingC"></div></div>

      <!-- 变更文件：一行摘要 -->
      <div class="mini-row" data-mini="files">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--green-400);flex-shrink:0"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
        <span style="font-weight:500;flex-shrink:0">变更文件</span>
        <span class="sum">SessionSummaryCard.tsx 新建 · AssistantBubble.tsx 修改 …</span>
        <span class="chip green" style="flex-shrink:0">4 个文件</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="hidden" data-mini-body="files"><div class="file-list" id="filesC"></div></div>

      <!-- 产物预览：一行摘要 -->
      <div class="mini-row" data-mini="prd">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--cyan-400);flex-shrink:0"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/></svg>
        <span style="font-weight:500;flex-shrink:0">产物预览</span>
        <span class="sum">PRD Prototype v2 · 需求看板首页</span>
        <span class="chip blue" style="flex-shrink:0">1 PRD · 2 MCP</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="hidden" data-mini-body="prd">
        <div id="prdC" style="margin-bottom:6px"></div>
        <div class="file-list" id="mcpC"></div>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
renderAssistant();
renderThinking(document.getElementById('thinkingC'), true);
renderFiles(document.getElementById('filesC'));
renderPRD(document.getElementById('prdC'), true);
renderMCP(document.getElementById('mcpC'));

/* 各行展开/收起 */
document.querySelectorAll('[data-mini]').forEach(row=>{
  row.addEventListener('click', ()=>{
    row.classList.toggle('open');
    const body = document.querySelector('[data-mini-body="'+row.dataset.mini+'"]');
    if(body) body.classList.toggle('hidden');
  });
});
</script>
</body>
</html>
